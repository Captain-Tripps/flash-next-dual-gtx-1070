<!doctype html>
<html lang="en">
<head>

<title>LGA 3647 Socket — mechanical showcase</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  #viewport { display: block; width: 100vw; height: 100vh; }
  #error-overlay {
    position: fixed; inset: 0; display: none; place-content: center;
    padding: 2rem; font: 500 1rem/1.5 system-ui, sans-serif; color: #f2d9a0;
    background: #14171c; white-space: pre-wrap;
  }
  #error-overlay.visible { display: grid; }

<body>
<canvas id="viewport"></canvas>
<div id="error-overlay"></div>
<script type="module">
"use strict";

// ---------------------------------------------------------------- math
// Column-major, same layout WebGL consumes, so matrices go straight to
// gl.uniformMatrix4fv with transpose=false. No allocation in the per-frame path:
// every node owns its matrices and writes into them.

const mat4 = {
  identity() {
    const m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },

  // out = a * b ("apply b first, then a", column-major convention).
  multiply(out, a, b) {
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  },

  transformPoint(out, m, p) {
    const [x, y, z] = p;
    out[0] = m[0] * x + m[4] * y + m[8] * z + m[12];
    out[1] = m[1] * x + m[5] * y + m[9] * z + m[13];
    out[2] = m[2] * x + m[6] * y + m[10] * z + m[14];
    return out;
  },

  // Translate * Rotate * Scale, rotation applied Y then X then Z (socket parts
  // yaw about the vertical axis; the plate tips about its local X).
  trs(out, { pos = [0, 0, 0], rot, scale = 1 }) {
    const sx = typeof scale === "number" ? scale : scale.x;
    const rx = rot?.x || 0, ry = rot?.y || 0, rz = rot?.z || 0;
    const cx = Math.cos(rx), sxn = Math.sin(rx);
    const cy = Math.cos(ry), syn = Math.sin(ry);
    const cz = Math.cos(rz), snz = Math.sin(rz);
    // Ry * Rx * Rz
    const r00 = cy * cz - syn * sxn * snz, r01 = -cy * snz - syn * sxn * cz, r02 = syn * cx;
    const r10 = snz * cx, r11 = cx * cz, r12 = -sxn;
    const r20 = -syn * cz - cy * sxn * snz, r21 = syn * snz - cy * sxn * cz, r22 = cy * cx;
    out[0] = r00 * sx; out[1] = r10 * sx; out[2] = r20 * sx; out[3] = 0;
    out[4] = r01 * sx; out[5] = r11 * sx; out[6] = r21 * sx; out[7] = 0;
    out[8] = r02 * sx; out[9] = r12 * sx; out[10] = r22 * sx; out[11] = 0;
    out[12] = pos[0]; out[13] = pos[1]; out[14] = pos[2]; out[15] = 1;
    return out;
  },

  perspective(out, { fovyDeg, aspect, near, far }) {
    const f = 1 / Math.tan((fovyDeg * Math.PI) / 360);
    const nf = 1 / (near - far);
    out.fill(0);
    out[0] = f / aspect;
    out[5] = f;
    out[10] = (far + near) * nf;
    out[11] = -1;
    out[14] = 2 * far * near * nf;
    return out;
  },

  // View space: camera at origin looking down -Z, so the forward basis is -Z.
  lookAt(out, eye, target, up) {
    let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    let len = Math.hypot(zx, zy, zz) || 1;
    zx /= len; zy /= len; zz /= len;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    len = Math.hypot(xx, xy, xz) || 1;
    xx /= len; xy /= len; xz /= len;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    out[15] = 1;
    return out;
  },

  // Upper-left 3x3 of a mat4, written column-major into a length-9 array.
  toMat3(out9, m) {
    out9[0] = m[0]; out9[1] = m[1]; out9[2] = m[2];
    out9[3] = m[4]; out9[4] = m[5]; out9[5] = m[6];
    out9[6] = m[8]; out9[7] = m[9]; out9[8] = m[10];
    return out9;
  },
};

// ---------------------------------------------------------------- scene graph
class Node {
  constructor(name) {
    this.name = name;
    this.local = { pos: [0, 0, 0], rot: { x: 0, y: 0, z: 0 }, scale: 1 };
    this.children = [];
    this.parent = null;
    this._localMatrix = mat4.identity();
    this._parentWorld = mat4.identity();
    this._worldMatrix = mat4.identity();
  }

  add(child) {
    child.parent = this;
    this.children.push(child);
    return child;
  }

  // Allocation-free: this node owns its matrices; the parent chain is written
  // into the child's own scratch (a different array on purpose, because
  // multiply(out, a, b) with out === a === b would alias mid-write).
  world(out) {
    mat4.trs(this._localMatrix, this.local);
    if (this.parent) {
      this.parent.world(this._parentWorld);
      mat4.multiply(this._worldMatrix, this._parentWorld, this._localMatrix);
    } else {
      this._worldMatrix.set(this._localMatrix);
    }
    out.set(this._worldMatrix);
    return out;
  }

  worldMatrix() {
    return this.world(mat4.identity());
  }
}

// ---------------------------------------------------------------- geometry
// Every part is a flat XZ profile extruded along +Y, generated in code. Caps
// are ear-clipped or quad-stripped (rings), side walls are per-face quads with
// flat normals, so chamfered steel reads as machined metal, not smooth plastic.

const signedArea2 = (pts) => {
  let sum = 0;
  for (let i = 0; i < pts.length; i += 2) {
    const j = (i + 2) % pts.length;
    sum += pts[i] * pts[j + 1] - pts[j] * pts[i + 1];
  }
  return sum;
};

const crossXZ = (a, b, c) =>
  (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);

/**
 * Ear-clipping for a simple (non-self-intersecting) XZ polygon; non-convex
 * outlines included. Returns vertex triples [x,z], CCW in xz — the extruder
 * orients each cap triangle to the facing it wants, so winding here is a
 * starting point, not a promise.
 */
function earClip(pts) {
  const poly = [];
  for (let i = 0; i < pts.length; i += 2) poly.push([pts[i], pts[i + 1]]);
  if (poly.length < 3) throw new Error("polygon needs at least 3 points");
  if (signedArea2(pts) < 0) poly.reverse();
  const tris = [];
  const ring = poly.slice();
  while (ring.length > 3) {
    let earAt = -1;
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length], c = ring[(i + 2) % ring.length];
      if (crossXZ(a, b, c) <= 1e-12) continue; // reflex or collinear: not an ear
      let coversAnother = false;
      for (const p of ring) {
        if (p === a || p === b || p === c) continue;
        if (crossXZ(a, b, p) > -1e-12 && crossXZ(b, c, p) > -1e-12 && crossXZ(c, a, p) > -1e-12) {
          coversAnother = true;
          break;
        }
      }
      if (!coversAnother) { earAt = i; break; }
    }
    if (earAt < 0) throw new Error("ear clip stalled: self-intersecting profile?");
    tris.push(ring[earAt], ring[earAt + 1], ring[earAt + 2]);
    ring.splice(earAt + 1, 1);
  }
  tris.push(ring[0], ring[1], ring[2]);
  return tris;
}

/**
 * Rounded-rectangle XZ profile, CCW, extents exactly w x h. Each quarter corner
 * is sampled with `segs` arc divisions (segs+1 points, both tangent points
 * included), so the flat edges between corners stay flat instead of getting
 * chorded into a chamfer — a sheared substrate outline would be a sin against
 * the whole point of this exercise.
 */
function roundedRectProfile(w, h, r, segs) {
  if (!(r > 0) || 2 * r >= Math.min(w, h)) throw new Error(`corner radius ${r} won't fit ${w}x${h}`);
  if (!(segs >= 1)) throw new Error("segs must be >= 1");
  const hx = w / 2 - r, hz = h / 2 - r;
  const centres = [[hx, hz, 0], [-hx, hz, Math.PI / 2], [-hx, -hz, Math.PI], [hx, -hz, (3 * Math.PI) / 2]];
  const pts = [];
  for (const [cx, cz, a0] of centres) {
    for (let i = 0; i <= segs; i++) {
      const a = a0 + (i * Math.PI) / (2 * segs);
      pts.push(cx + r * Math.cos(a), cz + r * Math.sin(a));
    }
  }
  return pts;
}

/**
 * Drops corner 3's interior arc points, keeping its two tangent points: the
 * quarter fillet becomes a straight 45deg cut. LGA 3647 is a keyed package —
 * the cut corner is what the load plate's orientation reads on screen. The
 * extents survive because the surviving tangent points own them.
 */
function withKeyingCut(pts, segs) {
  const cornerStart = 3 * (segs + 1) * 2;
  const cut = pts.slice();
  cut.splice(cornerStart + 2, (segs - 1) * 2);
  return cut;
}

/** Regular closed polygon in XZ, CCW, centred on the origin. Hinge rods, screw bosses. */
function circleProfile(radius, segs) {
  const pts = [];
  for (let i = 0; i < segs; i++) {
    const a = (i * 2 * Math.PI) / segs;
    pts.push(radius * Math.cos(a), radius * Math.sin(a));
  }
  return pts;
}

const rectProfile = (x0, z0, x1, z1) => [x0, z0, x1, z0, x1, z1, x0, z1];

function translatedProfile(pts, dx, dz) {
  const out = [];
  for (let i = 0; i < pts.length; i += 2) out.push(pts[i] + dx, pts[i + 1] + dz);
  return out;
}

function reverseContour(pts) {
  const out = [];
  for (let i = pts.length - 2; i >= 0; i -= 2) out.push(pts[i], pts[i + 1]);
  return out;
}

/**
 * Approximate parallel inset for chamfer bands: scale toward the centroid.
 * A mitred offset would be proper, but for 0.15 mm bevels on convex-ish
 * contours the difference is sub-pixel, and every band normal is recomputed
 * from the actual face anyway.
 */
function insetContour(pts, amount) {
  let cx = 0, cz = 0;
  for (let i = 0; i < pts.length; i += 2) { cx += pts[i]; cz += pts[i + 1]; }
  const n = pts.length / 2;
  cx /= n; cz /= n;
  let span = 0;
  for (let i = 0; i < pts.length; i += 2) span = Math.max(span, Math.hypot(pts[i] - cx, pts[i + 1] - cz));
  const t = Math.min(amount / span, 0.999);
  const out = [];
  for (let i = 0; i < pts.length; i += 2) {
    out.push(pts[i] + (cx - pts[i]) * t, pts[i + 1] + (cz - pts[i + 1]) * t);
  }
  return out;
}

/** Flat-shaded triangle push: winds toward `want`, normal from the actual face. */
function pushTri(mesh, a, b, c, want) {
  const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const e2 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
  let nx = e1[1] * e2[2] - e1[2] * e2[1];
  let ny = e1[2] * e2[0] - e1[0] * e2[2];
  let nz = e1[0] * e2[1] - e1[1] * e2[0];
  const len = Math.hypot(nx, ny, nz);
  if (len < 1e-12) return; // sliver: degenerate corners drop, they never ship
  nx /= len; ny /= len; nz /= len;
  if (nx * want[0] + ny * want[1] + nz * want[2] < 0) {
    [nx, ny, nz] = [-nx, -ny, -nz];
    const t = b; b = c; c = t;
  }
  const base = mesh.pos.length / 3;
  for (const p of [a, b, c]) {
    mesh.pos.push(p[0], p[1], p[2]);
    mesh.nrm.push(nx, ny, nz);
  }
  mesh.idx.push(base, base + 1, base + 2);
}

const yRing = (pts, y) => {
  const out = [];
  for (let i = 0; i < pts.length; i += 2) out.push([pts[i], y, pts[i + 1]]);
  return out;
};

/**
 * Extrude a closed XZ profile from y=0 to y=depth. Optional `hole` contour
 * cuts a ring (needs aligned point counts with the outer contour — both come
 * from roundedRectProfile with the same segs, so they do). A nonzero chamfer
 * bevels the top rim: the side walls stay vertical, only the visible rim is
 * cut. Holes never chamfer, they're too thin to matter.
 */
function extrudeProfile(outerContour, { depth, chamfer = 0, hole = null } = {}) {
  if (!(depth > 0)) throw new Error("extrusion needs a positive depth");
  const orientCCW = (contour) => (signedArea2(contour) >= 0 ? contour : reverseContour(contour));
  const outer = orientCCW(outerContour);
  // Holes keep the outer's angular order: the ring caps pair contour point i of
  // the outer with point i of the hole, so reversing the winding would twist
  // every quad in that strip. Facing is handled by flipping `want` instead.
  const inner = hole ? orientCCW(hole) : null;
  const c = chamfer > 0 ? Math.min(chamfer, depth / 2) : 0;
  const ys = c > 0 ? [0, depth - c, depth] : [0, depth];

  const contourAt = (i) => (c > 0 && i === ys.length - 1 ? insetContour(outer, c) : outer);
  const outerLevels = ys.map((y, i) => yRing(contourAt(i), y));
  const holeLevels = inner ? ys.map((y) => yRing(inner, y)) : null;

  const mesh = { pos: [], nrm: [], idx: [] };

  // Walls. The facing is the edge tangent rotated -90deg in XZ (outward for a
  // CCW loop); a bore's visible side faces into the bore, so holes get `flip`.
  const emitWalls = (levels, flip = false) => {
    for (let lv = 0; lv + 1 < levels.length; lv++) {
      const lo = levels[lv], hi = levels[lv + 1];
      for (let i = 0; i < lo.length; i++) {
        const p = lo[i], q = lo[(i + 1) % lo.length];
        const want = [q[2] - p[2], 0, p[0] - q[0]];
        const L = Math.hypot(want[0], want[2]) || 1;
        want[0] = (want[0] / L) * (flip ? -1 : 1);
        want[2] = (want[2] / L) * (flip ? -1 : 1);
        pushTri(mesh, p, q, hi[i], want);
        pushTri(mesh, q, hi[(i + 1) % hi.length], hi[i], want);
      }
    }
  };
  emitWalls(outerLevels);
  if (holeLevels) emitWalls(holeLevels, true);

  // Caps. Rings get a quad strip between aligned contours (earClip can't handle
  // two contours as one polygon); single contours get ear-clipped per rim, the
  // chamfered top rim clipping its own inset contour.
  const bottom = outerLevels[0], top = outerLevels[outerLevels.length - 1];
  if (inner) {
    const hb = holeLevels[0], ht = holeLevels[holeLevels.length - 1];
    if (hb.length !== bottom.length) throw new Error("ring caps need aligned outer/hole counts");
    for (let i = 0; i < bottom.length; i++) {
      const o1 = bottom[i], o2 = bottom[(i + 1) % bottom.length];
      const h1 = hb[i], h2 = hb[(i + 1) % hb.length];
      pushTri(mesh, o1, o2, h2, [0, -1, 0]);
      pushTri(mesh, o1, h2, h1, [0, -1, 0]);
      const t1 = top[i], t2 = top[(i + 1) % top.length];
      const u1 = ht[i], u2 = ht[(i + 1) % ht.length];
      pushTri(mesh, t1, u1, u2, [0, 1, 0]);
      pushTri(mesh, t1, u2, t2, [0, 1, 0]);
    }
  } else {
    const clipCap = (contour, y, wantY) => {
      const tris = earClip(contour);
      for (let i = 0; i < tris.length; i += 3) {
        const a = tris[i], b = tris[i + 1], c3 = tris[i + 2];
        pushTri(mesh, [a[0], y, a[1]], [b[0], y, b[1]], [c3[0], y, c3[1]], wantY);
      }
    };
    clipCap(contourAt(0), ys[0], [0, -1, 0]);
    clipCap(contourAt(ys.length - 1), ys[ys.length - 1], [0, 1, 0]);
  }
  return mesh;
}

function bboxOf(geometries) {
  const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
  for (const g of geometries) {
    for (let i = 0; i < g.pos.length; i += 3) {
      for (let k = 0; k < 3; k++) {
        min[k] = Math.min(min[k], g.pos[i + k]);
        max[k] = Math.max(max[k], g.pos[i + k]);
      }
    }
  }
  return { min, max };
}

// -------------------------------------------------------------- land grid
/**
 * LGA 3647 land-grid pattern, in millimetres, origin at the substrate centre.
 *
 * The field is a rectangular array of land positions punched by rectangular
 * cutouts: a wide central ILS window with a narrow stem above and below it, plus
 * a keyed notch on the latch side. The opening areas are tuned so the surviving
 * count lands on exactly 3,647 pads, the package's contact count — which is
 * what the pitch makes possible: a 76 x 61 mm envelope is 4,660 mm^2, so 3,647
 * lands at ~1.1 mm pitch leave about 1,000 mm^2 for openings.
 *
 * Rows run across X, one per `rowPitchMm`; each row's x-extent is split by every
 * cutout it crosses, so the row table *is* the socket shape rather than a
 * texture that happens to have a dark square in the middle.
 */
const LAND_GRID = {
  envelope: { w: 75.9, h: 61.4 },
  keepOutMm: 1.4, // pads never sit closer than this to the substrate edge
  colPitchMm: 1.0,
  rowPitchMm: 1.1,
  cutouts: [
    { name: "ils-window", x0: -6.5, x1: 6.5, z0: -7.15, z1: 7.15 },
    { name: "ils-stem-north", x0: -2.5, x1: 2.5, z0: 7.15, z1: 12.65 },
    { name: "ils-stem-south", x0: -2.5, x1: 2.5, z0: -12.65, z1: -7.15 },
    // Keying notch on the latch side: exactly one row tall (1.1 mm = one
    // rowPitch) and 3 columns wide, so it removes 3 pads and the surviving
    // count lands on the package's 3,647 contacts.
    { name: "key-notch-latch-side", x0: 20.5, x1: 23.5, z0: -21.5, z1: -20.5 },
  ],
};

/** Deterministic hash, so a pad's tone never changes between frames. */
function toneOfPad(col, row) {
  const h = Math.imul(col + 1024, 73) ^ Math.imul(row + 1024, 151);
  return ((h >>> 0) % 4096) / 4095;
}

/**
 * Which columns live in a row: every land whose centre is strictly inside a
 * cutout is punched out of that row. The predicate here must match the one the
 * tests assert, so "strictly inside" is load-bearing, not accidental.
 */
function rowSpans(grid, rowZ) {
  const insideCutout = (x, z) => grid.cutouts.some(
    (c) => x > c.x0 && x < c.x1 && z > c.z0 && z < c.z1
  );
  const spans = [];
  let run = null;
  for (let k = -grid.cols; k <= grid.cols; k++) {
    const x = k * grid.colPitchMm;
    if (insideCutout(x, rowZ)) {
      if (run) { spans.push(run); run = null; }
      continue;
    }
    if (!run) run = { fromCol: k, toCol: k };
    else run.toCol = k;
  }
  if (run) spans.push(run);
  for (const s of spans) {
    s.x0 = s.fromCol * grid.colPitchMm;
    s.x1 = s.toCol * grid.colPitchMm;
  }
  return spans;
}

/**
 * The whole pad field: pad centres, the interleaved instance buffer the GPU
 * consumes, and the per-row spans that generated the central opening.
 */
function composeLayout(grid = LAND_GRID) {
  const hx = grid.envelope.w / 2 - grid.keepOutMm;
  const hz = grid.envelope.h / 2 - grid.keepOutMm;
  const cols = Math.floor(hx / grid.colPitchMm);
  const rows = Math.floor(hz / grid.rowPitchMm);
  const shaped = { ...grid, cols, rows };

  const pads = [];
  const rowTable = [];
  for (let m = -rows; m <= rows; m++) {
    const z = m * grid.rowPitchMm;
    const spans = rowSpans(shaped, z);
    const count = spans.reduce((n, s) => n + (s.toCol - s.fromCol + 1), 0);
    rowTable.push({ index: m, z, spans, count });
    for (const s of spans) {
      for (let k = s.fromCol; k <= s.toCol; k++) {
        pads.push({
          x: k * grid.colPitchMm,
          z,
          tone: toneOfPad(k, m),
          phase: (k - s.fromCol) / Math.max(1, s.toCol - s.fromCol),
        });
      }
    }
  }

  const data = new Float32Array(pads.length * 4);
  for (let i = 0; i < pads.length; i++) {
    data[i * 4] = pads[i].x;
    data[i * 4 + 1] = pads[i].z;
    data[i * 4 + 2] = pads[i].tone;
    data[i * 4 + 3] = pads[i].phase;
  }

  return {
    grid: shaped,
    cutouts: grid.cutouts,
    rows: rowTable,
    pads,
    data,
    instanceCount: pads.length,
  };
}

/**
 * One land: a micro-plane with a bevelled rim, instanced `instanceCount` times.
 * Flat-shaded on purpose — at this size the bevel needs its own face to read at
 * all, and a smooth-shaded pad would be a shiny blur.
 */
function padMeshGeometry() {
  return extrudeProfile(rectProfile(-0.32, -0.3, 0.32, 0.3), { depth: 0.16, chamfer: 0.05 });
}

/**
 * One part, one buffer: a bracket plate plus its screw bosses collapse into a
 * single VBO/IBO so the GL layer draws each part exactly once instead of
 * re-binding attributes per batch. pushTri already duplicates vertices per
 * face, so merging is a copy plus an index offset.
 */
function mergeGeometries(geos) {
  const merged = { pos: [], nrm: [], idx: [] };
  for (const g of geos) {
    const offset = merged.pos.length / 3;
    for (const v of g.pos) merged.pos.push(v);
    for (const v of g.nrm) merged.nrm.push(v);
    for (const i of g.idx) merged.idx.push(i + offset);
  }
  return merged;
}

function makePart(name, geometries, local) {
  const node = new Node(name);
  node.local = local;
  const geometry = mergeGeometries(geometries);
  return {
    name, node, geometry,
    vertexCount: geometry.pos.length / 3,
    bbox: bboxOf([geometry]),
  };
}

/**
 * The socket, in millimetres, origin at the substrate centre: the land-grid
 * envelope is the XZ bbox of the substrate. Eight named parts; the pad field
 * is a placeholder slab until Task 4 instances its 3.6k gold pads.
 */
function buildParts() {
  const HZ = 61.4 / 2; // land-grid half-depth
  const SUB_T = 0.8, BR_T = 0.5, PLATE_T = 1.6;
  const BR_Y = SUB_T + 0.05;            // ILS plate rides on the substrate
  const HINGE_Y = BR_Y + 3.4;           // hinge rod sits above the screw bosses
  const HINGE_Z = HZ + 3.5;             // rod line lies outside the envelope

  // Keying corner: corner 3's quarter fillet becomes a 45deg straight cut, so
  // the package reads as oriented (and the load plate's corner notch has a mate).
  const outline = withKeyingCut(roundedRectProfile(75.9, 61.4, 4.5, 4), 4);

  const substrate = makePart("substrate",
    [extrudeProfile(outline, { depth: SUB_T, chamfer: 0.15 })],
    { pos: [0, 0, 0], rot: {}, scale: 1 });

  const frame = makePart("frame",
    [extrudeProfile(roundedRectProfile(79.3, 64.8, 6, 4),
      { depth: 4.2, chamfer: 0.3, hole: roundedRectProfile(74.2, 59.6, 3, 4) })],
    { pos: [0, -0.2, 0], rot: {}, scale: 1 });

  // The land grid: one micro-plane geometry, instanced once per pad. The
  // instance buffer is the layout's interleaved Float32Array, so nothing repeats
  // a pad position on the CPU per frame — the vertex shader offsets them.
  const layout = composeLayout();
  const padField = makePart("padField", [padMeshGeometry()],
    { pos: [0, SUB_T + 0.03, 0], rot: {}, scale: 1 });
  padField.layout = layout;
  padField.instanceCount = layout.instanceCount;
  padField.instances = layout.data;

  const bracket = [
    extrudeProfile(rectProfile(-33, -24.5, 33, 24.5), { depth: BR_T, chamfer: 0.12 }),
    extrudeProfile(rectProfile(-4, -30.5, 4, 30.5), { depth: BR_T, chamfer: 0.1 }),
    ...[-30, 30].flatMap((x) => [-27, 27].map((z) =>
      extrudeProfile(translatedProfile(circleProfile(3, 10), x, z), { depth: 2.4 }))),
  ];
  const brBracket = makePart("brBracket", bracket,
    { pos: [0, BR_Y, 0], rot: {}, scale: 1 });

  // Load plate: hinge edge at local z=0, body spans toward -z (latch side).
  // Positive local X rotation at the hinge rod lifts the far end (Task 7).
  const loadPlate = makePart("loadPlate",
    [extrudeProfile(rectProfile(-33, -68, 33, 1.5), { depth: PLATE_T, chamfer: 0.2 })],
    { pos: [0, HINGE_Y + 0.8, HINGE_Z], rot: {}, scale: 1 });

  // Rod extruded along its profile +Y, then z-rolled onto the world X axis:
  // rot.z=-pi/2 maps +Y to +X, which is where a hinge line belongs.
  const hingeBar = makePart("hingeBar",
    [extrudeProfile(circleProfile(1.5, 12), { depth: 79 })],
    { pos: [-39.5, HINGE_Y, HINGE_Z], rot: { x: 0, y: 0, z: -Math.PI / 2 }, scale: 1 });

  const latchLever = makePart("latchLever",
    [extrudeProfile(rectProfile(-2.2, -1.2, 2.2, 4.8), { depth: 3.4, chamfer: 0.15 })],
    { pos: [34, BR_Y + 1.4, -HZ - 3.5], rot: {}, scale: 1 });

  // Stiffener plate under the substrate, same footprint band as the frame wall:
  // it nests just inside the frame bore, so it reads as machined steel from
  // below without sharing any faces with the frame itself.
  const stiffenRing = makePart("stiffenRing",
    [extrudeProfile(roundedRectProfile(79.2, 64.7, 6, 4),
      { depth: 0.8, chamfer: 0.1, hole: roundedRectProfile(74.3, 59.7, 3, 4) })],
    { pos: [0, -1.0, 0], rot: {}, scale: 1 });

  return { substrate, frame, padField, brBracket, loadPlate, hingeBar, latchLever, stiffenRing };
}

window.__api = {
  mat4, Node, earClip, bboxOf, buildParts,
  roundedRectProfile, circleProfile, rectProfile, translatedProfile, withKeyingCut, extrudeProfile,
  LAND_GRID, composeLayout, padMeshGeometry,
};

const MAX_FRAME_MS = 50; // a backgrounded tab hands us 1 Hz deltas; never let them through

const canvas = document.getElementById("viewport");
const overlay = document.getElementById("error-overlay");

function reportFailure(cause, detail) {
  overlay.textContent = detail;
  overlay.classList.add("visible");
  window.__scene = {
    ok: false, cause, parts: {}, programs: {}, frames: 0,
    padCount: 0, plateAngleDeg: 0, azimuthDeg: 0,
  };
}

function boot() {
  const gl = canvas.getContext("webgl2", { antialias: true });
  if (!gl) {
    reportFailure("webgl2-unavailable", "WebGL2 is not available in this browser.\n" +
      "The socket render needs WebGL2 (antialias). Check that hardware acceleration is on.");
    return;
  }

  const scene = {
    ok: true, cause: "", parts: {}, programs: {}, frames: 0,
    padCount: 0, plateAngleDeg: 0, azimuthDeg: 0, drawCalls: 0,
  };
  window.__scene = scene;

  // Scene graph first, so the diagnostics are live before the first frame: the
  // harness asserts padCount comes from the layout, not a hardcoded 3647.
  const parts = buildParts();
  const socketRoot = new Node("socket");
  for (const part of Object.values(parts)) {
    socketRoot.add(part.node);
    scene.parts[part.name] = {
      vertexCount: part.vertexCount,
      indexCount: part.geometry.idx.length,
      instanceCount: part.instanceCount || 0,
    };
  }
  scene.padCount = parts.padField.instanceCount;
  scene.drawCalls = Object.keys(scene.parts).length;
  window.__sceneParts = parts;
  window.__socketRoot = socketRoot;

  gl.clearColor(0.05, 0.06, 0.07, 1);
  gl.enable(gl.DEPTH_TEST);

  let last = performance.now();
  const frame = (now) => {
    const dtMs = Math.min(Math.max(now - last, 0), MAX_FRAME_MS);
    last = now;
    scene.frames++;
    scene.azimuthDeg = (scene.azimuthDeg + dtMs * 0.004) % 360;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

boot();
</script>
</body>
</html>
