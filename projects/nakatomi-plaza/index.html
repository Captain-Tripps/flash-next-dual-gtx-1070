    if (!same(exit[exit.length - 1].pos, enter[0].pos) || !same(exit[exit.length - 1].target, enter[0].target))
      throw new Error(`${clock.order[i]} cuts to ${clock.order[i + 1]} - a continuous take cannot cut`);
  }
  // The loop home: the take ends where it started, so the wrap is a hold, not a jump.
  if (!same(keys[0].pos, keys[keys.length - 1].pos) || !same(keys[0].target, keys[keys.length - 1].target))
    throw new Error("the take does not end on its opening pose - the wrap would jump");

  // The glass-line key, checked on its own terms: 3.5 cells out from the shaft's
  // glass plane (cell x 12), at plaza level, with the curtain wall between it and
  // the tower.
  const GLASS_X = S.lower.x1 + 3.5;
  const proximity = keys.find((k) => Math.abs(k.pos[0] - GLASS_X) < 1e-9);
  if (!proximity) throw new Error("the take has no glass-line key 3.5 cells off the curtain wall");
  if (proximity.pos[1] > S.lower.y1)
    throw new Error("the glass-line key is not at plaza level");

  // --- the interpolation -----------------------------------------------------
  // Linear along the key track: the only mode that can be checked for
  // non-teleporting, because an eased curve has no fixed epsilon.
  const atOrBefore = (t) => {
    for (let i = keys.length - 1; i >= 0; i--) if (keys[i].t <= t) return i;
    return 0;
  };
  const copy = (k) => ({
    t: k.t,
    pos: { x: k.pos[0], y: k.pos[1], z: k.pos[2] },
    target: { x: k.target[0], y: k.target[1], z: k.target[2] },
    fov: k.fov,
  });
  const sampleAt = (t) => {
    const i = atOrBefore(t);
    const a = keys[i];
    const b = keys[Math.min(i + 1, keys.length - 1)];
    if (b === a) return { ...copy(a), t };
    const u = b.t === a.t ? 1 : Math.min(Math.max((t - a.t) / (b.t - a.t), 0), 1);
    const lerp = (p, q) => p + (q - p) * u;
    return {
      t,
      pos: { x: lerp(a.pos[0], b.pos[0]), y: lerp(a.pos[1], b.pos[1]), z: lerp(a.pos[2], b.pos[2]) },
      target: { x: lerp(a.target[0], b.target[0]), y: lerp(a.target[1], b.target[1]), z: lerp(a.target[2], b.target[2]) },
      fov: Math.min(Math.max(lerp(a.fov, b.fov), FOV_MIN), FOV_MAX),
    };
  };

  // Which beat a key belongs to. The clock's own window is the answer, so the
  // published id can not drift from what beatAt reports. A key that falls in the
  // hold window (there is none today) belongs to the take's last beat, whose
  // final key is the loop home.
  const beatOf = (k) => {
    const b = clock.beatAt(k.t);
    return b ? b.id : clock.order[clock.order.length - 1];
  };

  // A beat's own keys, as the slice of the master track it owns.
  const keysFor = (id) => keysOf(id).map((k) => ({
    t: k.t, pos: [k.pos[0], k.pos[1], k.pos[2]], target: [k.target[0], k.target[1], k.target[2]], fov: k.fov,
  }));

  // The witness layer for the fed beats: the pull-back is shot west of the lane
  // and above it, looking down the boulevard the batch stands on. These keys are
  // not the take - the take's fed legs are authored above - but the arc is the
  // convoy route's own waypoints, so the shot matches the geometry that was laid
  // down at t = 0 (R19). Seven samples across the beat, one every frac of 1/6.
  const routeKeys = (id) => {
    const t0 = clock.start(id);
    const dur = clock.dur(id);
    const out = [];
    for (let i = 0; i <= 6; i++) {
      const f = i / 6;
      const p = convoy.routeAt(f);
      const k = {
        t: t0 + f * dur,
        pos: [p.x - 9, p.y + 7, p.z - 10],
        target: [p.x, p.y + 2, p.z + 4],
        fov: 48,
      };
      const cell = { x: Math.floor(k.pos[0]), y: Math.floor(k.pos[1]), z: Math.floor(k.pos[2]) };
      if (envelope.isOutside(cell) !== true)
        throw new Error(`route key at t=${k.t} is inside the envelope at ${cell.x},${cell.y},${cell.z}`);
      out.push(k);
    }
    return out;
  };

  return {
    rig: {
      keys: keysFor,
      // The beat argument is not decoration: it picks the slice, and the slice's
      // ends are what a caller outside the beat's own window clamps to.
      sample: (id, t) => {
        const t0 = clock.start(id);
        const t1 = t0 + clock.dur(id);
        const p = sampleAt(Math.min(Math.max(t, t0), t1));
        return { ...p, t };
      },
      allKeys: () => keys.map((k) => ({ t: k.t, id: beatOf(k) })),
      all: () => keys.map((k) => ({
        t: k.t, pos: [k.pos[0], k.pos[1], k.pos[2]], target: [k.target[0], k.target[1], k.target[2]], fov: k.fov,
      })),
      routeKeys,
      fovRange: [FOV_MIN, FOV_MAX],
      glassLineKey: { t: proximity.t, pos: [proximity.pos[0], proximity.pos[1], proximity.pos[2]], from: S.lower.x1 },
      window: [clock.start(clock.order[0]), clock.start("drestle") + clock.dur("drestle")],
    },
  };
})());

// Fragment 13: the show's audio queue and the HUD's text - both driven by the clock.
//
// The queue is data first: an entry names a voice and keys itself to a beat, and the
// beat decides its time (`clock.start(id) + off`) - the rig's R20 lesson applies here
// too, no entry carries a hand-kept number. Because it is data, the gate can walk the
// whole show with no browser and no AudioContext, and the plan's invariant (Review
// Focus 5) is pinned at build time: every entry audible from BEAT_END on carries the
// hold marker, and the gate rejects any that does not. A sound during the HOLD is
// legal only because it says so.
//
// Autoplay: the AudioContext is created inside unlock(), which the page calls from the
// first pointer/keyboard gesture. Nothing here touches the DOM, GL or audio at eval
// time - the boot gate runs this fragment with neither.

Object.assign(NAKATOMIC, (() => {
  const clock = NAKATOMIC.clock;

  // --- voices. Each is a factory of WebAudio nodes; none runs until the context is
  // live, so the queue above stays testable without a browser. `when` is a context
  // time, `out` the master gain. Envelopes always start from a near-zero value: an
  // exponential ramp cannot start at silence, and starting at 0 means starting at a
  // click instead of at the start of the sound.
  const white = (ctx, dur) => {
    const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
    const a = buf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    return buf;
  };
  const voices = {
    // Tile Helo - the whomp: a low rotor whoop, sub glide down, blade slap under it.
    whomp(ctx, out, when) {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(82, when);
      o.frequency.exponentialRampToValueAtTime(46, when + 0.3);
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 150; lp.Q.value = 4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1e-3, when);
      g.gain.exponentialRampToValueAtTime(0.55, when + 0.06);
      g.gain.exponentialRampToValueAtTime(1e-3, when + 0.5);
      o.connect(lp).connect(g).connect(out);
      o.start(when); o.stop(when + 0.55);
      const slap = ctx.createBufferSource();
      slap.buffer = white(ctx, 0.06);
      const sg = ctx.createGain();
      sg.gain.setValueAtTime(1e-3, when);
      sg.gain.exponentialRampToValueAtTime(0.12, when + 0.005);
      sg.gain.exponentialRampToValueAtTime(1e-3, when + 0.07);
      slap.connect(sg).connect(out);
      slap.start(when); slap.stop(when + 0.08);
    },
    // The blast crack, and thunder: a noise burst over a sub that slides down.
    crack(ctx, out, when) {
      const n = ctx.createBufferSource();
      n.buffer = white(ctx, 0.4);
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1e-3, when);
      g.gain.exponentialRampToValueAtTime(0.9, when + 0.004);
      g.gain.exponentialRampToValueAtTime(1e-3, when + 0.45);
      n.connect(bp).connect(g).connect(out);
      n.start(when); n.stop(when + 0.5);
      const sub = ctx.createOscillator();
      sub.type = "sine";
      sub.frequency.setValueAtTime(55, when);
      sub.frequency.exponentialRampToValueAtTime(28, when + 0.3);
      const slp = ctx.createBiquadFilter();
      slp.type = "lowpass"; slp.frequency.value = 90;
      const sg = ctx.createGain();
      sg.gain.setValueAtTime(1e-3, when);
      sg.gain.exponentialRampToValueAtTime(0.5, when + 0.01);
      sg.gain.exponentialRampToValueAtTime(1e-3, when + 0.4);
      sub.connect(slp).connect(sg).connect(out);
      sub.start(when); sub.stop(when + 0.45);
    },
    // Sirens, near and far: the two-tone wail, twice, with a bandpass to thin it.
    siren(ctx, out, when) {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      const f = o.frequency;
      f.setValueAtTime(660, when);
      for (const c of [0, 1]) {
        const b = when + c * 0.9;
        f.linearRampToValueAtTime(980, b + 0.45);
        f.linearRampToValueAtTime(660, b + 0.9);
      }
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 1400; bp.Q.value = 2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1e-3, when);
      g.gain.exponentialRampToValueAtTime(0.28, when + 0.05);
      g.gain.exponentialRampToValueAtTime(1e-3, when + 1.85);
      o.connect(bp).connect(g).connect(out);
      o.start(when); o.stop(when + 1.9);
    },
    // Facade break: glass falling in place of the blast's low end.
    glass(ctx, out, when) {
      const n = ctx.createBufferSource();
      n.buffer = white(ctx, 0.9);
      const hp = ctx.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = 2500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1e-3, when);
      g.gain.exponentialRampToValueAtTime(0.5, when + 0.01);
      g.gain.exponentialRampToValueAtTime(1e-3, when + 0.9);
      n.connect(hp).connect(g).connect(out);
      n.start(when); n.stop(when + 0.95);
      for (const [hz, decay] of [[2600, 0.5], [2000, 0.62], [1500, 0.78]]) {
        const t = ctx.createOscillator();
        t.type = "triangle";
        t.frequency.setValueAtTime(hz, when);
        t.frequency.exponentialRampToValueAtTime(hz * 0.4, when + decay);
        const tg = ctx.createGain();
        tg.gain.setValueAtTime(1e-3, when);
        tg.gain.exponentialRampToValueAtTime(0.12, when + 0.01);
        tg.gain.exponentialRampToValueAtTime(1e-3, when + decay);
        t.connect(tg).connect(out);
        t.start(when); t.stop(when + decay + 0.05);
      }
    },
    // Motorpool: the limo and the fed SUVs - a low rumble that swells in.
    engine(ctx, out, when) {
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 140; lp.Q.value = 6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1e-3, when);
      g.gain.exponentialRampToValueAtTime(0.4, when + 0.7);
      g.gain.exponentialRampToValueAtTime(1e-3, when + 2.3);
      lp.connect(g).connect(out);
      for (const [hz, type] of [[46, "sawtooth"], [92, "sawtooth"]]) {
        const o = ctx.createOscillator();
        o.type = type; o.frequency.value = hz;
        o.connect(lp);
        o.start(when); o.stop(when + 2.4);
      }
    },
    // The hold: low room tone, the show's tail under the still frame.
    room(ctx, out, when) {
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 200;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1e-3, when);
      g.gain.exponentialRampToValueAtTime(0.15, when + 2);
      g.gain.exponentialRampToValueAtTime(1e-3, when + 11);
      lp.connect(g).connect(out);
      for (const hz of [44, 66.3]) {
        const o = ctx.createOscillator();
        o.type = "sine"; o.frequency.value = hz;
        o.connect(lp);
        o.start(when); o.stop(when + 11.2);
      }
    },
  };

  // --- the queue, keyed to the beat table. Entries carry `off` - a beat offset, so
  // the beat decides the absolute time. One hold entry exists on purpose: the show is
  // not silent under the still frame, and it is the only sound allowed out there.
  const entries = [
    { name: "engine", id: "limoNakatomi", off: 3 },          // motorpool rolls in
    ...Array.from({ length: 7 }, (_, i) =>                   // tile helo, 7 whomps
      ({ name: "whomp", id: "tileHelo", off: i * 6 })),
    { name: "crack", id: "blast", off: 0.5 },                // the break itself
    { name: "glass", id: "storm", off: 0.3 },                // first facade fallout
    { name: "crack", id: "storm", off: 2.5 },                // thunder, one beat later
    { name: "siren", id: "storm", off: 30 },                 // distant, inside the storm
    { name: "engine", id: "fedConvoy", off: 1 },             // the feds come up the boulevard
    { name: "siren", id: "fedConvoy", off: 14 },
    { name: "siren", id: "wallOfCars", off: 2 },
    { name: "siren", id: "wallOfCars", off: 20 },
    { name: "engine", id: "carDepart", off: 2 },             // cars off the lot
    { name: "room", hold: true, off: 2 },                    // audible under the hold
  ];
  const queue = entries.map((e) => {
    const t = e.hold ? clock.BEAT_END + e.off : clock.start(e.id) + e.off;
    return { name: e.name, id: e.id, off: e.off, t, ...(e.hold ? { hold: true } : {}) };
  }).sort((a, b) => a.t - b.t);

  // Build-time gates, mirroring what the unit suite asserts: a voice has to exist to
  // synth the entry, the hold invariant has to hold both ways, and a beat-keyed entry
  // has to land inside the beat's own window. clock.start throws on a bad id.
  let prev = -Infinity;
  for (const e of queue) {
    if (!(e.name in voices)) throw new Error(`audio entry ${e.name}@${e.t} has no voice`);
    if (!(e.t > prev)) throw new Error(`audio entries at ${prev} and ${e.t} do not move forward`);
    prev = e.t;
    if (!!e.hold !== (e.t >= clock.BEAT_END))
      throw new Error(`audio entry ${e.name}@${e.t} disagrees with the hold window`);
    if (!e.hold) {
      if (!clock.order.includes(e.id)) throw new Error(`audio entry keys to ${e.id}, outside clock.order`);
      const s = clock.start(e.id);
      if (!(e.t >= s && e.t < s + clock.dur(e.id)))
        throw new Error(`audio entry ${e.name}@${e.t} sits outside the window of ${e.id}`);
    }
  }

  // --- the playhead walker. The render loop hands pump its frame; pump schedules
  // only what crossed between the last frame and this one. A step backwards (the
  // wrap, a paused tool's seek) schedules nothing: the show plays forward, once.
  let lastT = -1;
  let fired = 0;                      // crossings the page's pump has reported
  let ctx = null;
  let master = null;

  const audio = {
    queue, voices,
    get live() { return ctx !== null; },
    get fired() { return fired; },
    // Only ever called from a gesture handler: the autoplay policy hands the context
    // to the page on the first pointerdown/keydown, not at load.
    unlock() {
      if (ctx) return ctx;
      const AC = (typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext)) || null;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      return ctx;
    },
    reset() { lastT = -1; fired = 0; },
    eventsBetween(prev, next) {
      if (!(next > prev)) return [];
      return queue.filter((e) => e.t > prev && e.t <= next);
    },
    pump(f) {
      const next = Number(f.t) || 0;
      const from = f.wrapped ? -1 : lastT;
      lastT = next;
      const evs = audio.eventsBetween(from, next);
      fired += evs.length;
      if (ctx) for (const e of evs) voices[e.name](ctx, master, ctx.currentTime + 0.02);
      return evs.length;
    },
  };

  // --- the HUD's text, also pure functions. The label rule is the plan's Review
  // Focus 5 in one place: beatAt is null through the hold, and null is not a missing
  // label - it is the hold, so it has its own text.
  const hud = {
    label(f) {
      if (!f) return "";
      const b = f.beat || clock.beatAt(f.t);
      if (b) return b.label;
      return f.t >= clock.BEAT_END ? clock.HOLD_LABEL : "";
    },
    // opts: { source, framing, framings, paused } - which camera made the frame and
    // whether a tool is holding it still. The meta line is what the review shots read.
    meta(f, opts) {
      return `${f.t.toFixed(2)} s of ${clock.SHOW_LEN}`
        + `  ${(f.beat && f.beat.id) || "hold"}`
        + (opts.source === "take" ? "  take" : `  framing ${opts.framing}/${opts.framings}`)
        + (opts.paused ? "  paused" : "");
    },
    stat(o) { return `${o.points} splats  ${o.voxels} vox  fps ${o.fps.toFixed(0)}`; },
    text(f, opts) {
      return { beat: hud.label(f), meta: hud.meta(f, opts), stat: hud.stat(opts) };
    },
  };

  return { audio, hud };
})());

// Fragment 99: the render rig - world to screen. First pixels.
//
// R18 said the wiring belonged in Task 13; Jon pulled it forward as Task 7.5 on
// 2026-11-25 so Tasks 7-12 land visibly instead of blind. The `99-` prefix is not
// cosmetics: fragments 01..98 must have published their APIs before this one reads
// the shared buffer, because the world is assembled here, once.
//
// Nothing at eval time touches the DOM, GL or the ground batch: the boot gate in
// verify/unit.mjs runs the page with no browser, and it stays green only because
// the renderer, the camera and the event bindings appear inside start(). The one
// exception is the scene object itself, whose shape is pinned by that gate.
//
// The show's own camera: Task 12 publishes NAKATOMIC.rig = { keys, sample }, and
// the loop below consumes it when it is there (scene.follow). Until then the loop
// drives the hand-rolled orbit rig - no addons, per the plan's one-rule imports.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const clock = NAKATOMIC.clock;
  const envelope = NAKATOMIC.envelope;

  // --- the buffer view, in point form. Page-side twin of tools/jsp.mjs, kept
  // THREE-free so the gate can run it with no GL and compare both sides. --------
  const splats = (buffer) => {
    if (!buffer || !Array.isArray(buffer.runs))
      throw new Error("splats wants the buffer view: { runs: [...], hexOf(id) }");
    const points = [];
    const colors = [];
    for (const r of buffer.runs) {
      const hex = buffer.hexOf(r.id);
      if (!hex) throw new Error(`no palette colour for id 0x${Number(r.id).toString(16)}`);
      for (let i = 0; i < r.len; i++) {
        points.push([r.x + i, r.y, r.z]);
        colors.push(hex);
      }
    }
    return { points, colors };
  };

  // --- one world, built once. Fragments 03/04 emitted at boot; the ground,
  // lobby, dressing and convoy batches are on demand, so this is the place that
  // pulls them in. A second call returns the cached world: the render loop must
  // never rebuild the plaza per frame. ----------------------------------------
  let world = null;
  const ensureWorld = () => {
    if (world === null) {
      const ground = NAKATOMIC.ground();
      const lobby = NAKATOMIC.lobbyWorld();
      const dressing = NAKATOMIC.plazaDressing();
      const roof = NAKATOMIC.roofWorld();
      const convoy = NAKATOMIC.convoyWorld();
      world = {
        ground,
        lobby,
        dressing,
        roof,
        convoy,
        bounds: vox.bounds(),
        voxels: vox.count,
        buffer: vox.buffer(),
      };
    }
    return world;
  };

  // --- framing 1..4: the four camera setups the show reads as its own wide shots.
  // yaw is the orbit angle in degrees (0 = the +z side of the block, so ~180 faces
  // the plaza front, where the glass atrium and the lobby arcade are), pitch is the
  // elevation, and `dist` is a multiple of the envelope radius - every setup here
  // starts further out than the tower's own corner, before the clamp ever runs.
  const FRAMINGS = [
    // Framing 1 is the wide establishing shot: the whole massing (roofline to lot
    // edge) has to sit in frame with sky above it, so the target sits mid-tower and
    // the lens stays well out. Framing 2 is the tower close, 3 the lobby-level pass,
    // 4 looks back over the deck.
    { name: "boulevard wide", yaw: 208, pitch: 10, dist: 2.4, fov: 46, target: [0, 18, -6] },
    { name: "tower close", yaw: 168, pitch: 12, dist: 1.15, fov: 42, target: [0, 24, 0] },
    { name: "lobby level", yaw: 186, pitch: 4, dist: 2.25, fov: 50, target: [0, 4, -8] },
    { name: "over the deck", yaw: 196, pitch: 48, dist: 2.3, fov: 44, target: [0, 16, 10] },
  ];

  // sRGB hex -> the linear values the renderer's working space wants, so the
  // palette hexes the gates assert on are the hexes the eye sees. Inline because
  // THREE.Color is not available to the gate stub, and math is cheaper anyway.
  // The /255 is the whole business: srgbToLinear wants a 0..1 channel, and handing
  // it the raw byte makes pow((107 + 0.055) / 1.055, 2.4) = 65,350, which clamps to
  // white in the shader and washes the whole plaza out. Exposed as NAKATOMIC.colorLinear
  // so the gate can pin the range for every palette entry, and so the fx tasks read
  // colours through the same one function.
  const srgbToLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const colorLinear = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    return [
      srgbToLinear(((n >> 16) & 0xff) / 255),
      srgbToLinear(((n >> 8) & 0xff) / 255),
      srgbToLinear((n & 0xff) / 255),
    ];
  };

  // R12/R13: the lens stays outside the tower envelope, always. The orbit target
  // can sit inside the building, so a distance clamp alone does not guarantee it -
  // this walks the point out along its own ray from the target until the envelope
  // agrees. That makes `envelope.isOutside(camera.position)` an invariant, not a
  // configuration, and Task 14 asserts it as one.
  const clearOfEnvelope = (target, p) => {
    let pos = { x: p.x, y: p.y, z: p.z };
    if (envelope.isOutside(pos)) return pos;
    let dx = pos.x - target.x, dy = pos.y - target.y, dz = pos.z - target.z;
    let len = Math.hypot(dx, dy, dz);
    if (len < 1e-6) { dy = 1; len = 1; }               // a lens on its own target: lift it up
    const ux = dx / len, uy = dy / len, uz = dz / len;
    let d = Math.max(len, 1);
    for (let i = 0; i < 240 && !envelope.isOutside(pos); i++) {
      d *= 1.08;
      pos = { x: target.x + ux * d, y: target.y + uy * d, z: target.z + uz * d };
    }
    return pos;
  };

  // --- the blast/storm fx: the one overlay that is a function of t. It never
  // joins the static cloud - the base glass line is one build, once, and the
  // fx only draws *over* it, which is what lets the wrap restore everything by
  // returning empty cells outside the window. The overlay is a fixed-size
  // Points buffer repainted per frame inside the window; outside it, drawRange
  // goes to zero and the layer is gone. ---------------------------------------
  let fxObj = null;
  const FX_MAX = 512;
  const paintFx = (t) => {
    if (!NAKATOMIC.fx) return;
    const cells = NAKATOMIC.fx.at(t);
    if (!fxObj) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(FX_MAX * 3), 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(FX_MAX * 3), 3));
      geo.setDrawRange(0, 0);
      const mat = new THREE.PointsMaterial({
        size: 1.15, sizeAttenuation: true, vertexColors: true, fog: true, depthWrite: false,
      });
      mat.depthTest = true;
      fxObj = new THREE.Points(geo, mat);
      fxObj.renderOrder = 2;                       // after the cloud, over the glass it replaces
      sceneObj.add(fxObj);
    }
    const pos = fxObj.geometry.attributes.position.array;
    const col = fxObj.geometry.attributes.color.array;
    let n = 0;
    for (const c of cells) {
      if (n >= FX_MAX) break;
      const hex = NAKATOMIC.palette.hexOf(c.id);
      const lin = colorLinear(hex);
      pos[n * 3] = c.x; pos[n * 3 + 1] = c.y; pos[n * 3 + 2] = c.z + (c.zShift || 0);
      col[n * 3] = lin[0]; col[n * 3 + 1] = lin[1]; col[n * 3 + 2] = lin[2];
      n++;
    }
    fxObj.geometry.setDrawRange(0, n);
    fxObj.geometry.attributes.position.needsUpdate = true;
    fxObj.geometry.attributes.color.needsUpdate = true;
    scene.stats.fx = n;
  };

  // rig state: spherical orbit around a target. `pose` is the show's own camera
  // (Task 12's rig feeds it through setPose); while it is set, orbit state idles.
  const rig = {
    yaw: 0, pitch: 0, dist: 0, target: { x: 0, y: 0, z: 0 },
  };
  let pose = null;
  // Which camera made the frame the HUD describes: the show's own take ("take",
  // set by step() from Task 12's keys), a pose pinned by a tool ("lens"), or one
  // of the four fixed framings. The screenshots beside the pixel bars are the
  // review proof, so they have to say what they show.
  let poseSource = "framing";
  let rigReady = false;

  const applyPose = (camera, pos, target, fov) => {
    camera.position.set(pos.x, pos.y, pos.z);
    if (fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
    camera.lookAt(target.x, target.y, target.z);
  };

  const orbitPos = () => {
    const cp = Math.cos(rig.pitch * Math.PI / 180);
    const cy = Math.cos(rig.yaw * Math.PI / 180);
    const sz = Math.sin(rig.yaw * Math.PI / 180);
    const pos = {
      x: rig.target.x + rig.dist * cp * sz,
      y: rig.target.y + rig.dist * Math.sin(rig.pitch * Math.PI / 180),
      z: rig.target.z + rig.dist * cp * cy,
    };
    return clearOfEnvelope(rig.target, pos);
  };

  // The scene's public object is assembled before start(): the gate asserts its
  // shape with no GL in the room, so every key exists at eval time.
  const scene = {
    running: false,
    paused: false,
    follow: true,
    gl: null,
    camera: null,
    domElement: null,
    fov: FRAMINGS[0].fov,
    framing: 1,
    // Read-only view of which camera painted the current frame: "take" (Task 12's
    // keys through step()), "lens" (a pose pinned by a tool), "framing" (one of four).
    get cameraSource() { return poseSource; },
    stats: { points: 0, voxels: 0, fps: 0, fx: 0 },

    // The HUD's label rule, as a pure function: beatAt is null through the hold,
    // so a null beat is not a missing label - it is the hold, and it needs a label.
    // Task 13's `hud.label` owns that rule; deferring here keeps the page's label
    // and the HUD fragment's from ever disagreeing.
    label(f) { return NAKATOMIC.hud.label(f); },

    setFraming(n) {
      const i = Math.min(Math.max(Number(n) || 1, 1), FRAMINGS.length);
      const f = FRAMINGS[i - 1];
      scene.framing = i;
      rig.yaw = f.yaw;
      rig.pitch = f.pitch;
      rig.dist = envelope.radius * f.dist;
      rig.target = { x: f.target[0], y: f.target[1], z: f.target[2] };
      scene.fov = f.fov;
      pose = null;
      poseSource = "framing";
      if (rigReady) applyPose(scene.camera, orbitPos(), rig.target, scene.fov);
      return i;
    },

    // The show's own camera pose: { pos, target, fov } in buffer units. Task 12's
    // per-beat keys land here; the envelope clamp still runs, so a key that tries
    // to put the lens inside the tower ends up outside it anyway.
    setPose(p) {
      if (!p || !p.pos) return null;
      const target = p.target || { x: 0, y: 0, z: 0 };
      const pos = clearOfEnvelope(target, { x: p.pos.x, y: p.pos.y, z: p.pos.z });
      pose = { pos, target, fov: p.fov };
      poseSource = p.from || "lens";
      if (pose.fov) scene.fov = pose.fov;
      if (rigReady) applyPose(scene.camera, pose.pos, pose.target, pose.fov);
      return pose;
    },

    togglePause() { scene.paused = !scene.paused; return scene.paused; },
    restart() { clock.restart(); pose = null; return clock.t; },

    // Rebuilds the splat cloud from the current buffer: the content tasks (7..12)
    // add geometry and the shatter fx change ids, so the cloud has to be re-read.
    rebuild() {
      if (!rigReady) return scene.stats;
      world = null;
      const w = ensureWorld();
      const s = splats(w.buffer);
      const n = s.points.length;
      const positions = new Float32Array(n * 3);
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const p = s.points[i];
        positions[i * 3] = p[0]; positions[i * 3 + 1] = p[1]; positions[i * 3 + 2] = p[2];
        const c = colorLinear(s.colors[i]);
        colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2];
      }
      if (cloud) {
        sceneObj.remove(cloud);
        cloud.geometry.dispose();
        cloud.material.dispose();
      }
      cloud = null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.95, sizeAttenuation: true, vertexColors: true, fog: true,
      });
      cloud = new THREE.Points(geo, mat);
      sceneObj.add(cloud);
      scene.stats.points = n;
      scene.stats.voxels = w.voxels;
      return scene.stats;
    },

    // One frame of the show. The rAF wrapper calls it, and the pixel gates drive it
    // by hand, so both paths exercise the same code: one clock tick, one pose, one
    // render, one HUD update, one fade value.
    step(dt) {
      // While paused the tool owns the clock (it seeks, then paints), so the frame
      // comes from the clock's current state instead of a stale tick.
      frame = scene.paused ? frameFromClock() : clock.tick(dt);
      const w = ensureWorld();
      // Task 13's audio queue walks the same frame: while paused the tool owns the
      // clock (it seeks, then paints), so it must never hear a replay of the show.
      if (!scene.paused && NAKATOMIC.audio) NAKATOMIC.audio.pump(frame);
      if (!scene.paused && scene.follow && NAKATOMIC.rig && frame.beat) {
        const key = NAKATOMIC.rig.sample(frame.beat.id, frame.t);
        if (key) scene.setPose({ pos: key.pos, target: key.target, fov: key.fov, from: "take" });
      }
      if (rigReady) {
        paintFx(frame.t);
        if (pose) applyPose(scene.camera, pose.pos, pose.target, pose.fov);
        else applyPose(scene.camera, orbitPos(), rig.target, scene.fov);
        if (hud) paintHud(frame);
        gl.render(sceneObj, scene.camera);
      }
      return frame;
    },

    start() {
      if (scene.running) return scene;
      const stage = document.getElementById("stage");
      gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      gl.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      gl.setSize(window.innerWidth, window.innerHeight);
      gl.outputColorSpace = THREE.SRGBColorSpace;
      const dusk = new THREE.Color(0x0a0c12);
      gl.setClearColor(dusk, 1);
      stage.appendChild(gl.domElement);
      scene.gl = gl;
      scene.domElement = gl.domElement;

      sceneObj = new THREE.Scene();
      sceneObj.background = dusk;
      sceneObj.fog = new THREE.FogExp2(0x0a0c12, 0.0022);

      const w = ensureWorld();
      scene.camera = new THREE.PerspectiveCamera(
        FRAMINGS[0].fov, window.innerWidth / window.innerHeight, 0.5,
        // far reaches past the skyline walls at z = 70 from any orbit the rig allows
        Math.max(600, envelope.radius * 8),
      );
      scene.setFraming(1);
      // rigReady comes first: without it the rebuild below is a no-op, because
      // rebuild's own guard refuses to read a buffer before the rig exists.
      rigReady = true;
      scene.rebuild();
      hud = {
        beat: document.getElementById("beat"),
        meta: document.getElementById("meta"),
        stat: document.getElementById("stat"),
        fade: document.getElementById("fade"),
      };
      bindInput(gl.domElement);
      scene.running = true;
      loop = (now) => {
        requestAnimationFrame(loop);
        const dt = lastNow === null ? clock.dtClamp : (now - lastNow) / 1000;
        lastNow = now;
        scene.step(dt);
        // A plain EMA of the frame rate: the HUD reads it, nothing in the show does.
        const rate = 1 / Math.max(dt, 1e-4);
        scene.stats.fps = scene.stats.fps ? scene.stats.fps * 0.9 + rate * 0.1 : rate;
      };
      requestAnimationFrame(loop);
      return scene;
    },
  };

  // --- internals the closure owns; the public object above is the only handle ----
  let gl = null;
  let sceneObj = null;
  let cloud = null;
  let hud = null;
  // A frame from the clock without advancing it: what `step` reads while paused.
  const frameFromClock = () => ({
    t: clock.t, beat: clock.beatAt(clock.t), black: clock.fade.black, wrapped: false,
  });
  let frame = frameFromClock();
  let lastNow = null;
  let loop = null;

  // The text itself lives in Task 13's hud fragment, so the queue's invariant and
  // the HUD's hold fallback are one function, not two that could drift. This one
  // only pushes the strings into elements - and the fade overlay's opacity stays
  // here, because that is the renderer's job, not the text's.
  const paintHud = (f) => {
    const lines = NAKATOMIC.hud.text(f, {
      source: poseSource, framing: scene.framing, framings: FRAMINGS.length,
      paused: scene.paused, points: scene.stats.points, voxels: scene.stats.voxels,
      fps: scene.stats.fps,
    });
    hud.beat.textContent = lines.beat;
    hud.meta.textContent = lines.meta;
    hud.stat.textContent = lines.stat;
    hud.fade.style.opacity = String(f.black);
  };

  const bindInput = (canvas) => {
    let drag = null;
    canvas.addEventListener("pointerdown", (e) => {
      // The autoplay policy wants a gesture before a page may start a sound: the
      // first pointer/keyboard press unlocks the queue, and until then the show is
      // silent and the queue keeps walking (pump counts crossings with no context).
      NAKATOMIC.audio && NAKATOMIC.audio.unlock();
      drag = { x: e.clientX, y: e.clientY, yaw: rig.yaw, pitch: rig.pitch };
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag) return;
      rig.yaw = drag.yaw + (e.clientX - drag.x) * 0.28;
      rig.pitch = Math.min(88, Math.max(-20, drag.pitch - (e.clientY - drag.y) * 0.22));
      pose = null;
    });
    const up = () => { drag = null; };
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointerleave", up);
    canvas.addEventListener("wheel", (e) => {
      const min = envelope.radius * 1.05;      // the lens never gets inside the tower
      rig.dist = Math.min(envelope.radius * 6, Math.max(min, rig.dist * (1 + e.deltaY * 0.0012)));
      pose = null;
    }, { passive: true });
    window.addEventListener("keydown", (e) => {
      NAKATOMIC.audio && NAKATOMIC.audio.unlock();
      const k = e.key;
      if (k >= "1" && k <= String(FRAMINGS.length)) scene.setFraming(Number(k));
      else if (k === " ") { scene.togglePause(); e.preventDefault(); }
      else if (k === "r" || k === "R") scene.restart();
    });
    window.addEventListener("resize", () => {
      if (!gl) return;
      gl.setSize(window.innerWidth, window.innerHeight);
      scene.camera.aspect = window.innerWidth / window.innerHeight;
      scene.camera.updateProjectionMatrix();
    });
  };

  return { splats, ensureWorld, colorLinear, scene };
})());

</script>
</body>
