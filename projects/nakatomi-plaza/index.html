<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nakatomi Plaza - dusk, one take</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0c12; color: #cfd3dd;
    font: 13px/1.45 ui-monospace, Consolas, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 12px; right: 12px; pointer-events: none;
    text-shadow: 0 1px 3px #000; }
  #beat { top: 12px; font-size: 15px; letter-spacing: .04em; }
  #meta { top: 34px; color: #8f96a6; font-size: 12px; }
  #stat { right: auto; top: 58px; color: #6f7787; font-size: 11px; }
  #foot { bottom: 12px; color: #8f96a6; font-size: 11px; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="beat" class="hud"></div>
<div id="meta" class="hud"></div>
<div id="stat" class="hud"></div>
<div id="foot" class="hud">drag orbit - wheel zoom - 1..4 framings - space pause - R restart</div>
<div id="fade"></div>
<script type="module">
import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.187.0/three.module.min.js";

// Every fragment attaches its API here; the page's only global.
const NAKATOMIC = { version: "0.1.0" };
window.NAKATOMIC = NAKATOMIC;

// Fragment 02: the voxel run buffer and the palette gate.
//
// The buffer stores horizontal runs along +X only: addStack turns a vertical
// stack into one length-1 run per level, so the merge rule stays a single axis.
// Spans are keyed by (palette id, z, y) and coalesced on insert, so overlapping
// or repeated runs are never double-counted or double-drawn. Everything
// downstream - render, AO, the splat view, the pixel gates - reads this list.

Object.assign(NAKATOMIC, {
  palette: (() => {
    const RESERVED = 0xe000;           // 0xe001 and above: never scene-owned
    const ALLOC_FROM = 0x0100;        // auto-allocated scene ids start here
    const ALLOC_THROUGH = 0xd000;     // 0xd001..0xdfff is the glass block, not for auto-ids
    const hexById = new Map();
    const idByHex = new Map();

    const norm = (hex) => {
      if (typeof hex === "string") {
        const h = hex.trim().toLowerCase();
        if (!/^#[0-9a-f]{6}$/.test(h)) throw new Error(`bad palette hex: ${hex}`);
        return h;
      }
      if (Number.isInteger(hex) && hex >= 0) return "#" + hex.toString(16).padStart(6, "0");
      throw new Error(`bad palette hex: ${hex}`);
    };

    const define = (id, hex) => {
      if (!Number.isInteger(id) || id < 0) throw new Error(`bad palette id: ${id}`);
      if (id > RESERVED) throw new Error(`palette id 0x${id.toString(16)} is reserved`);
      const h = norm(hex);
      hexById.set(id, h);
      idByHex.set(h, id);
      return id;
    };

    // A hex's id, allocated from the scene range when it is not yet claimed.
    const idFor = (hex) => {
      const h = norm(hex);
      if (idByHex.has(h)) return idByHex.get(h);
      let id = ALLOC_FROM;
      while (hexById.has(id)) {
        id++;
        if (id > ALLOC_THROUGH) throw new Error("scene palette ids exhausted");
      }
      return define(id, h);
    };

    // True when every id the scene geometry used stays out of the reserved
    // range. Throws listing every offender, so a failing gate names the fix.
    const gate = () => {
      const offenders = new Set();
      for (const id of NAKATOMIC.vox.ids()) if (id > RESERVED) offenders.add(`0x${id.toString(16)}`);
      for (const id of hexById.keys()) if (id > RESERVED) offenders.add(`palette 0x${id.toString(16)}`);
      if (offenders.size) throw new Error(`reserved palette ids: ${[...offenders].join(", ")}`);
      return true;
    };

    return { define, id: idFor, hexOf: (id) => hexById.get(id) ?? null, gate, entries: hexById };
  })(),

  vox: (() => {
    const spans = new Map();                       // `${id}|${z}|${y}` -> [{x,len}]
    const key = (id, y, z) => `${id}|${z}|${y}`;
    const spansFor = (id, y, z) => {
      const k = key(id, y, z);
      let list = spans.get(k);
      if (!list) { list = []; spans.set(k, list); }
      return list;
    };

    const addRun = (x, y, z, len, id) => {
      if (!Number.isInteger(x) || !Number.isInteger(y) || !Number.isInteger(z))
        throw new Error(`vox coords must be integers: ${x},${y},${z}`);
      if (!Number.isInteger(len) || len < 1) throw new Error(`bad run length: ${len}`);
      if (!Number.isInteger(id)) throw new Error(`bad palette id: ${id}`);

      // Insert one span, then coalesce every span it touches - overlapping or
      // merely adjacent - so one logical run stays one logical run.
      const list = spansFor(id, y, z);
      let start = x, end = x + len;
      const keep = [];
      for (const s of list) {
        if (s.x + s.len < start || s.x > end) { keep.push(s); continue; }
        start = Math.min(start, s.x);
        end = Math.max(end, s.x + s.len);
      }
      keep.push({ x: start, len: end - start });
      keep.sort((a, b) => a.x - b.x);
      spans.set(key(id, y, z), keep);
    };

    const addStack = (x, y0, z, height, id) => {
      if (!Number.isInteger(height) || height < 1) throw new Error(`bad stack height: ${height}`);
      for (let i = 0; i < height; i++) addRun(x, y0 + i, z, 1, id);
    };

    const forEachRun = (fn) => {
      for (const [k, list] of spans) {
        const [id, z, y] = k.split("|").map(Number);
        for (const s of list) fn({ x: s.x, y, z, len: s.len, id });
      }
    };
    const collect = () => { const runs = []; forEachRun((r) => runs.push(r)); return runs; };

    return {
      addRun,
      addStack,
      // Clears every span. The unit tests take a fresh buffer this way; the
      // render gate rebuilds the world from the same fragments.
      reset: () => spans.clear(),
      get count() { let n = 0; forEachRun((r) => { n += r.len; }); return n; },
      ids: () => { const s = new Set(); for (const k of spans.keys()) s.add(Number(k.split("|")[0])); return s; },
      bounds: () => {
        const b = { min: { x: Infinity, y: Infinity, z: Infinity }, max: { x: -Infinity, y: -Infinity, z: -Infinity } };
        forEachRun((r) => {
          b.min.x = Math.min(b.min.x, r.x); b.max.x = Math.max(b.max.x, r.x + r.len - 1);
          b.min.y = Math.min(b.min.y, r.y); b.max.y = Math.max(b.max.y, r.y);
          b.min.z = Math.min(b.min.z, r.z); b.max.z = Math.max(b.max.z, r.z);
        });
        return b;
      },
      runs: collect,
      // The one buffer view: what render builds from, and what tools/jsp.mjs
      // turns into splats for the pixel gates.
      buffer: () => ({ runs: collect(), hexOf: (id) => NAKATOMIC.palette.hexOf(id) }),
    };
  })(),
});

// Fragment 03: the tower core and the outside-envelope contract.
//
// Structure only, in storey bands: podium, the 42-story shaft, the 25-35 setback
// band, the upper shaft, the roof deck and the mechanical penthouse. The
// curtain-wall glass cells come in Task 4; this fragment draws the concrete and
// the mullions and leaves the glazed bays open, so no cell is drawn twice.
//
// Same-palette-id runs on the same cell self-merge, so spandrels and decks can
// overlap each other freely; different ids must never claim the same cell, which
// is why the mullion columns below sit on offsets the concrete posts avoid.
//
// The envelope is the contract the camera is held to (Rulings 12/13): the podium
// footprint plus a 2 m skirt, full height, top at the roof deck. A point inside
// the envelope is a point the camera is not allowed to occupy.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const idC = NAKATOMIC.palette.id("#6b6f78");   // spandrel / deck concrete
  const idM = NAKATOMIC.palette.id("#2c3038");   // curtain-wall mullion

  // Dimensions from DESIGN.md 4 - inclusive cell coordinates.
  const P = { x0: -20, x1: 20, z0: -17, z1: 17, y0: 0, y1: 3 };      // podium
  const S = { x0: -12, x1: 12, z0: -12, z1: 12, y0: 4, y1: 27 };     // lower shaft
  const K = { x0: -10, x1: 10, z0: -10, z1: 10, y0: 28, y1: 38 };    // setback band
  const U = { x0: -11, x1: 11, z0: -11, z1: 11, y0: 39, y1: 45 };    // upper shaft
  const DECK_Y = 46;
  const PH = { x0: -9, x1: 9, z0: -9, z1: 9, y0: 47, y1: 49 };       // penthouse
  const SKIRT = 2;                                  // R12/13: clear of the glass line

  // A band filled solid along +X: one run per z row, so the merge rule holds.
  const slabBand = (y, f, id) => {
    for (let z = f.z0; z <= f.z1; z++) vox.addRun(f.x0, y, z, f.x1 - f.x0 + 1, id);
  };

  // The outer wall of a band: a mullion column every third cell on each face.
  // The two-cell bays between them are glazing - Task 4 fills them, so no cell
  // is claimed twice.
  const wallBand = (y, f, id) => {
    // Corner posts stand on every row, so both face grids agree on the corner
    // cell and the glazing rule always sees a closed frame at the corners.
    for (const [cx, cz] of [[f.x0, f.z0], [f.x0, f.z1], [f.x1, f.z0], [f.x1, f.z1]])
      vox.addRun(cx, y, cz, 1, id);
    for (let x = f.x0; x <= f.x1; x++)
      if ((x - f.x0) % 3 === 0) { vox.addRun(x, y, f.z0, 1, id); vox.addRun(x, y, f.z1, 1, id); }
    for (let z = f.z0; z <= f.z1; z++)
      if ((z - f.z0) % 3 === 0) { vox.addRun(f.x0, y, z, 1, id); vox.addRun(f.x1, y, z, 1, id); }
  };

  const section = (f, id) => { for (let y = f.y0; y <= f.y1; y++) wallBand(y, f, id); };

  // ---- the build ----
  section(P, idC);                                 // podium mullion grid, arcade level
  slabBand(P.y1, P, idC);                          // podium deck (plaza terrace)
  // The arcade glazing between the podium mullions is Task 4's job, along with
  // the shaft bays - one curtain wall, one grid, so no cell is claimed twice.

  section(S, idM);                                 // shaft, storeys 1-24
  section(K, idM);                                 // shaft, storeys 25-35 (setback)
  section(U, idM);                                 // shaft, storeys 36-42

  slabBand(DECK_Y, U, idC);                        // roof deck
  for (let y = PH.y0; y <= PH.y1; y++) {           // mechanical penthouse
    for (let x = PH.x0; x <= PH.x1; x++)
      for (const z of [PH.z0, PH.z1]) vox.addRun(x, y, z, 1, idC);
    for (let z = PH.z0 + 1; z <= PH.z1 - 1; z++)
      for (const x of [PH.x0, PH.x1]) vox.addRun(x, y, z, 1, idC);
  }
  slabBand(PH.y1, PH, idC);                        // penthouse cap

  const envelope = {
    min: { x: P.x0 - SKIRT, y: P.y0, z: P.z0 - SKIRT },
    max: { x: P.x1 + SKIRT, y: DECK_Y, z: P.z1 + SKIRT },
  };

  // The envelope follows the building, band by band: the horizontal limit is 2 m
  // clear of the facade at that height. A single podium box would let a camera
  // sit on the shaft, because the podium is wider than the tower it carries.
  envelope.profile = [
    { y0: P.y0, y1: P.y1, x0: P.x0 - SKIRT, x1: P.x1 + SKIRT, z0: P.z0 - SKIRT, z1: P.z1 + SKIRT },
    { y0: S.y0, y1: S.y1, x0: S.x0 - SKIRT, x1: S.x1 + SKIRT, z0: S.z0 - SKIRT, z1: S.z1 + SKIRT },
    { y0: K.y0, y1: K.y1, x0: K.x0 - SKIRT, x1: K.x1 + SKIRT, z0: K.z0 - SKIRT, z1: K.z1 + SKIRT },
    { y0: U.y0, y1: U.y1, x0: U.x0 - SKIRT, x1: U.x1 + SKIRT, z0: U.z0 - SKIRT, z1: U.z1 + SKIRT },
    { y0: DECK_Y, y1: DECK_Y, x0: U.x0 - SKIRT, x1: U.x1 + SKIRT, z0: U.z0 - SKIRT, z1: U.z1 + SKIRT },
  ];

  envelope.isOutside = (pt) => {
    if (pt.y < envelope.min.y || pt.y > envelope.max.y) return true;   // R12/13: over the deck
    const band = envelope.profile.find((b) => pt.y >= b.y0 && pt.y <= b.y1);
    if (!band) return true;                                            // a gap is clear space
    return pt.x < band.x0 || pt.x > band.x1 || pt.z < band.z0 || pt.z > band.z1;
  };
  const cx = (envelope.min.x + envelope.max.x) / 2;
  const cy = (envelope.min.y + envelope.max.y) / 2;
  const cz = (envelope.min.z + envelope.max.z) / 2;
  envelope.radius = Math.hypot(envelope.max.x - cx, envelope.max.y - cy, envelope.max.z - cz);
  envelope.centre = { x: cx, y: cy, z: cz };

  return {
    envelope,
    tower: {
      built: true,
      height: DECK_Y,
      roofDeck: DECK_Y,
      penthouseTop: PH.y1,
      storeys: 42,
      footprint: { shaft: [S.x1 - S.x0 + 1, S.z1 - S.z0 + 1], podium: [P.x1 - P.x0 + 1, P.z1 - P.z0 + 1] },
      sections: { podium: P, lower: S, setback: K, upper: U, penthouse: PH },
    },
  };
})());

// Fragment 04: the curtain wall - glass cells over every shaft and podium bay,
// plus the dusk lit rule that decides which bays glow at 6 pm on Christmas Eve.
//
// Task 3 drew the mullion grid: a frame column every third cell of each face,
// corners always on the frame. This fragment fills the bays between them with
// glass, so the facade ring is fully covered and no cell is claimed twice.
//
// Two quantities carry the look:
//   litFraction - the glazing coverage of the facade ring (brief: 0.55..0.75).
//   litShare    - the share of glazed cells that glow from inside (brief's
//                 ruling "most dark, lobby bright", so well under half).
// The glow itself is an additive layer in the render (Task 14 samples it); the
// buffer here carries the warm colour so the lit bays read warm in the splats.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const palette = NAKATOMIC.palette;

  // Glass ids are pinned inside the 0xd001 block - never auto-allocated, so the
  // block stays reserved for glazing and the gate never sees an id it can't name.
  const ids = {
    dark: palette.define(0xd001, "#2b3243"),    // dusk glass, reflecting the sky
    lit: palette.define(0xd002, "#ffcc77"),     // warm interior glow
    shatter: palette.define(0xd003, "#e8f4ff"), // the blast panes (Task 10)
  };
  const glassIds = Object.values(ids);

  const S = NAKATOMIC.tower.sections;
  const bands = [S.podium, S.lower, S.setback, S.upper];

  // The facade ring of a band, cell by cell, corners once. The podium's top row
  // is a deck slab, not a bay.
  const ring = (f) => {
    const y1 = f === S.podium ? f.y1 - 1 : f.y1;
    const out = [];
    for (let y = f.y0; y <= y1; y++) {
      for (let x = f.x0; x <= f.x1; x++) out.push({ x, y, z: f.z0, f, face: "z" });
      for (let x = f.x0; x <= f.x1; x++) out.push({ x, y, z: f.z1, f, face: "z" });
      for (let z = f.z0 + 1; z <= f.z1 - 1; z++) {
        out.push({ x: f.x0, y, z, f, face: "x" });
        out.push({ x: f.x1, y, z, f, face: "x" });
      }
    }
    return out;
  };

  // A bay is glazed when it sits between mullions. Corner cells are always frame,
  // which keeps the two face rules agreeing on the corner cell.
  const isFrame = (c) => {
    const f = c.f;
    if (c.x === f.x0 || c.x === f.x1) {
      if (c.z === f.z0 || c.z === f.z1) return true;
      return (c.z - f.z0) % 3 === 0;
    }
    return (c.x - f.x0) % 3 === 0;
  };

  // The dusk rule. The arcade and the atrium glow warm; the tower above is dark
  // at dusk except the odd office left on after work.
  const ATRIUM_Y = 9;
  const isLit = (c) => {
    const f = c.f;
    if (c.y <= S.podium.y1 - 1) return true;                                   // lobby, arcade
    if (f === S.lower && c.z === S.lower.z0 && c.y <= ATRIUM_Y) return true;   // atrium face
    if (f === S.podium) return false;
    if (c.y < 13) return false;                                                // dark band above the atrium
    return (c.x - f.x0 + (c.z - f.z0) + c.y) % 8 === 0;                        // a few offices on
  };

  const cells = [];
  for (const f of bands)
    for (const c of ring(f)) {
      if (isFrame(c)) continue;
      const lit = isLit(c);
      const id = lit ? ids.lit : ids.dark;
      // Thin run: one cell deep, so the glass sits on the facade plane the
      // mullions define instead of burying itself in the floor plate.
      vox.addRun(c.x, c.y, c.z, 1, id);
      cells.push({ x: c.x, y: c.y, z: c.z, id, lit });
    }

  // Facade ring cells, band by band: both face planes full width, minus the
  // corners the second plane would otherwise count twice.
  const facadeCells = bands.reduce((n, f) => {
    const y1 = f === S.podium ? f.y1 - 1 : f.y1;
    const rows = y1 - f.y0 + 1;
    const ringPerRow = 2 * (f.x1 - f.x0 + 1) + 2 * (f.z1 - f.z0 + 1) - 4;
    return n + rows * ringPerRow;
  }, 0);

  const litCount = cells.reduce((n, c) => n + (c.lit ? 1 : 0), 0);

  return {
    glass: {
      cells,
      ids,
      glassIds,
      facadeCells,
      litFraction: cells.length / facadeCells,   // glazing coverage of the facade
      litShare: litCount / cells.length,         // the dusk rule, as a share of glaze
      litCount,
      lit: (id) => id === ids.lit || id === ids.shatter,
    },
  };
})());

// Fragment 05: the ground contract - the sunken garage lot, the sunken driveway
// with its bridge, the entry plaza with a reflecting pool, a palm grove, and the
// distant skyline as full-width splices.
//
// The numbers are the contract, not an outcome: countVox is locked at 9406 and
// skylineCount at 2860 (30.4 % of the batch), the two numbers v1 verified. The
// skyline band is 110 columns wide, so its volume is width x the sum of the three
// wall heights (6 + 12 + 8 = 26 bands = 2860) and the rest of the ground carries
// the remaining 6546, which resolves as:
//
//   paving (deck band, holes cut)  4885
//   lot floor 341 + 5 retaining rings 400
//   driveway floor 135 + 2 rings 184 + bridge deck 135
//   pool (basin band + water band)   66
//   boulevard kerbs, with a crossing 244
//   12 palms (4 trunk + 3x3 canopy) 156
//
// A rectangle's retaining ring is 2(w + d) - 4 cells, so the lot's 31 x 11 ring is
// 80 cells and five bands of it is 400 - that is how the lot width was chosen.
//
// Vertical: the paving deck is the band at y = -1, its top face is street level,
// so anything that stands on the ground starts at y = 0 (streetY) - the same band
// the tower's first podium row occupies. The garage lot floor is y = -6 and the
// sunken driveway floor is y = -3.
//
// Volumes are counted in voxels, the unit the rest of the contract uses: 1 unit
// horizontally = 1 m, 1 band vertically = one storey.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const palette = NAKATOMIC.palette;

  const idStone = palette.id("#7d7f86");     // plaza paving, wet stone at dusk
  const idCurb = palette.id("#5a5d64");      // boulevard kerb stones
  const idGarage = palette.id("#4e5259");    // garage lot shell
  const idDitch = palette.id("#454a52");     // sunken driveway shell
  const idBridge = palette.id("#6b6f78");    // bridge deck; the tower's concrete id,
                                             // and it only ever claims its own cells
  const idWater = palette.id("#243a4d");     // reflecting pool: basin and water
  const idTrunk = palette.id("#4a3b2e");     // palm trunks
  const idFrond = palette.id("#20361f");     // palm canopies
  const idSky = palette.id("#1c2230");       // skyline mass
  const idSkyWin = palette.id("#8a6a4a");    // skyline window bands, the lit far city

  const DECK = -1;                           // paving band; top face = street level
  const STREET = 0;                          // streetY: what stands on the ground
  const LOT = -6;                            // garage lot floor band
  const DITCH = -3;                          // sunken driveway floor band

  // --- the plan ---
  const BLOCK = { x0: -43, x1: 43, z0: -31, z1: 30 };            // the block: plaza + boulevard
  const LOT_RECT = { x0: -15, x1: 15, z0: -31, z1: -21 };        // sunken lot, 31 x 11
  const DITCH_RECT = { x0: -22, x1: 22, z0: -20, z1: -18 };      // sunken driveway, 45 x 3
  const POOL = { x0: -5, x1: 5, z0: 25, z1: 27 };                // reflecting pool, 11 x 3
  const KERB_X = [-35, 34];                                      // boulevard kerb strips, 2 wide
  const KERB_GAP = -1;                                           // pedestrian crossing
  const PALMS = [[-36, -25], [-30, -25], [-24, -25], [24, -25], [30, -25], [36, -25],
                 [-36, 25], [-30, 25], [-24, 25], [24, 25], [30, 25], [36, 25]];
  const SKY = { x0: -55, x1: 54 };                               // 110 columns
  const SKY_WALLS = [{ z: 44, h: 6 }, { z: 56, h: 12 }, { z: 70, h: 8 }];
  const SKY_IDS = [idSkyWin, idSkyWin, ...Array(4).fill(idSky)]; // window bands, then mass
  const SKY_ID_SET = new Set(SKY_IDS);

  // --- the batch, with its own occupancy map so a cell can not be claimed twice ---
  const runs = [];
  const cells = new Map();
  const claim = (x, y, z, id) => {
    const key = `${x}|${y}|${z}`;
    const seen = cells.get(key);
    if (seen !== undefined) {
      if (seen !== id) throw new Error(`ground cell ${key} claimed by two palette ids`);
      return;
    }
    cells.set(key, id);
  };
  const put = (x, y, z, len, id) => {
    if (len <= 0) return;
    vox.addRun(x, y, z, len, id);
    runs.push({ x, y, z, len, id });
    for (let i = 0; i < len; i++) claim(x + i, y, z, id);
  };
  const fill = (x0, x1, y, z0, z1, id) => {
    for (let z = z0; z <= z1; z++) put(x0, y, z, x1 - x0 + 1, id);
  };
  const stack = (x, y0, z, height, id) => {
    for (let i = 0; i < height; i++) put(x, y0 + i, z, 1, id);
  };
  const ring = (r, y, id) => {
    for (let x = r.x0; x <= r.x1; x++) { put(x, y, r.z0, 1, id); put(x, y, r.z1, 1, id); }
    for (let z = r.z0 + 1; z <= r.z1 - 1; z++) { put(r.x0, y, z, 1, id); put(r.x1, y, z, 1, id); }
  };

  const emit = () => {
    // ---- the plaza deck, cut open where the lot, the driveway and the pool go down
    const holes = [LOT_RECT, DITCH_RECT, POOL];
    for (let z = BLOCK.z0; z <= BLOCK.z1; z++) {
      let x = BLOCK.x0;
      for (const h of holes.filter((q) => z >= q.z0 && z <= q.z1).sort((a, b) => a.x0 - b.x0)) {
        if (h.x0 > x) put(x, DECK, z, h.x0 - x, idStone);
        x = Math.max(x, h.x1 + 1);
      }
      if (x <= BLOCK.x1) put(x, DECK, z, BLOCK.x1 - x + 1, idStone);
    }

    // ---- the sunken garage lot: floor, shell walls, open to the sky above
    fill(LOT_RECT.x0, LOT_RECT.x1, LOT, LOT_RECT.z0, LOT_RECT.z1, idGarage);
    for (let y = LOT + 1; y <= DECK; y++) ring(LOT_RECT, y, idGarage);

    // ---- the sunken driveway and the bridge that carries the boulevard across it
    fill(DITCH_RECT.x0, DITCH_RECT.x1, DITCH, DITCH_RECT.z0, DITCH_RECT.z1, idDitch);
    for (let y = DITCH + 1; y <= DECK; y++) ring(DITCH_RECT, y, idDitch);
    fill(DITCH_RECT.x0, DITCH_RECT.x1, STREET, DITCH_RECT.z0, DITCH_RECT.z1, idBridge);

    // ---- the reflecting pool: basin floor, then water flush with the paving
    fill(POOL.x0, POOL.x1, DECK, POOL.z0, POOL.z1, idWater);
    fill(POOL.x0, POOL.x1, STREET, POOL.z0, POOL.z1, idWater);

    // ---- boulevard kerbs, with a crossing at the block's centre line
    for (const cx of KERB_X)
      for (let z = BLOCK.z0; z <= BLOCK.z1; z++) {
        if (z === KERB_GAP) continue;
        put(cx, STREET, z, 2, idCurb);
      }

    // ---- palm grove along the boulevard: 4-band trunks, 3 x 3 canopy
    for (const [px, pz] of PALMS) {
      stack(px, STREET, pz, 4, idTrunk);
      fill(px - 1, px + 1, STREET + 4, pz - 1, pz + 1, idFrond);
    }

    // ---- the distant skyline: stacked full-width splices, no gap column
    for (const w of SKY_WALLS)
      for (let i = 0; i < w.h; i++) {
        const band = SKY_IDS[Math.min(i, SKY_IDS.length - 1)];
        put(SKY.x0, STREET - 1 + i, w.z, SKY.x1 - SKY.x0 + 1, band);
      }

    // ---- the numbers. The occupancy map is the truth: it holds every cell the
    // batch claims, counted once, which is what a merged run buffer can lose.
    const skyIdSet = SKY_ID_SET;
    let skylineCount = 0;
    for (const [, id] of cells) if (skyIdSet.has(id)) skylineCount++;
    const area = (r) => (r.x1 - r.x0 + 1) * (r.z1 - r.z0 + 1);
    const b = {
      min: { x: Infinity, y: Infinity, z: Infinity },
      max: { x: -Infinity, y: -Infinity, z: -Infinity },
    };
    for (const r of runs) {
      b.min.x = Math.min(b.min.x, r.x);
      b.max.x = Math.max(b.max.x, r.x + r.len - 1);
      b.min.y = Math.min(b.min.y, r.y);
      b.max.y = Math.max(b.max.y, r.y);
      b.min.z = Math.min(b.min.z, r.z);
      b.max.z = Math.max(b.max.z, r.z);
    }

    return {
      voxels: runs.slice(),
      batchVox: runs.length,
      countVox: cells.size,
      bounds: b,
      // the sunken space each feature holds, in voxel bands, not the masonry
      garageVolume: area(LOT_RECT) * (DECK - LOT + 1),
      ditchVolume: area(DITCH_RECT) * (DECK - DITCH + 1),
      plazaVolume: area(BLOCK) - area(LOT_RECT) - area(DITCH_RECT) - area(POOL),
      waterVolume: area(POOL),
      palmCount: PALMS.length,
      skylineCount,
      streetY: STREET,
    };
  };

  // The batch is emitted once: the render loop reads the shared buffer, so a
  // rebuild would push the same cells through addRun again and grow the batch's
  // own `runs` list while the coalesced buffer stayed put - a split second world.
  let cached = null;
  const ground = () => { if (cached === null) cached = emit(); return cached; };

  return {
    ground,
    isOnGround: (x, z) => x >= BLOCK.x0 && x <= BLOCK.x1 && z >= BLOCK.z0 && z <= BLOCK.z1,
    skyline: { x0: SKY.x0, x1: SKY.x1, walls: SKY_WALLS, ids: [...SKY_ID_SET] },
    _plan: { BLOCK, LOT_RECT, DITCH_RECT, POOL, PALMS, KERB_X, DECK, STREET, LOT, DITCH },
  };
})());

// Fragment 06: the show clock. One beat table, one continuous take.
//
// The constants are the v1 hand-off numbers, pinned by tests: the 24 durations sum
// to BEAT_END = 715, blast starts at 360, storm runs 390..485 at dur 95 (it absorbs
// the slack), HOLD 20, SHOW_LEN 735, FADE_LEN 6, FADE_START 729.
//
// The wrap is a one-clamp grace: the frame clock may not advance by more than
// dtClamp per tick, and the loop cut only happens once t passes
// wrapAt = SHOW_LEN + dtClamp. That gives the fade an observable full-black frame
// before the cut instead of the cut swallowing it, and it means a page that sat in a
// background tab can not skip through the show on the first frame back.

Object.assign(NAKATOMIC, (() => {
  // Appendix A, in scene order. Deltas are Jon-reviewable; the durations are the
  // contract, not a starting point to drift from.
  const BEATS = [
    { id: "open", label: "Dusk over the boulevard - establishing", dur: 34 },
    { id: "taxiConvoy", label: "Taxi convoy onto the lot", dur: 38 },
    { id: "horseCar", label: "Horse car and motorcycle escort", dur: 33 },
    { id: "limoNakatomi", label: "Nakatomi Plaza signage, glass lobby", dur: 38 },
    { id: "treeTruck", label: "Christmas tree truck, light trucks", dur: 36 },
    { id: "archWalk", label: "Walkway, palms, marquee", dur: 35 },
    { id: "treeSet", label: "Tree set down beneath the glass", dur: 34 },
    { id: "skateHolly", label: "Holly on skates to the doors", dur: 32 },
    { id: "gunRun", label: "Gun run staged on the roof", dur: 38 },
    { id: "tileHelo", label: "Tile helo - the whomp", dur: 42 },
    { id: "blast", label: "Blast - first facade break (starts at 360)", dur: 30 },
    { id: "storm", label: "Storm over the skyline (dur 95)", dur: 95 },
    { id: "fedConvoy", label: "Fed convoys up the boulevard", dur: 42 },
    { id: "wallOfCars", label: "Wall of police cars on the lot", dur: 36 },
    { id: "lobbyLights", label: "Lobby lights hold under dusk", dur: 34 },
    { id: "carDepart", label: "Cars off the lot at dusk pull-back", dur: 22 },
    { id: "treeGlow", label: "Tree glow, canopy shimmer", dur: 18 },
    { id: "fountainSettle", label: "Fountain settles, water still", dur: 15 },
    { id: "plazaWide", label: "Plaza wide, empty walkway", dur: 13 },
    { id: "skyPush1", label: "Skyline push-in 1", dur: 11 },
    { id: "skyPush2", label: "Skyline push-in 2", dur: 10 },
    { id: "towerPull", label: "Tower pull-back to boulevard", dur: 9 },
    { id: "rooftopGlow", label: "Rooftop glow, penthouse lights", dur: 8 },
    { id: "drestle", label: "Final settling frame before the hold", dur: 12 },
  ];

  const BEAT_END = 715;      // the beat timeline's length
  const HOLD = 20;           // R14: still frame at the end
  const SHOW_LEN = BEAT_END + HOLD;   // 735
  const FADE_LEN = 6;
  const FADE_START = SHOW_LEN - FADE_LEN;   // 729
  const dtClamp = 0.25;      // one frame of grace: the most a tick may advance
  const wrapAt = SHOW_LEN + dtClamp;        // the loop cut
  const HOLD_LABEL = "Hold - still frame";  // what the HUD shows in the hold

  const order = BEATS.map((b) => b.id);
  const byId = new Map();
  let acc = 0;
  for (const b of BEATS) {
    if (byId.has(b.id)) throw new Error(`duplicate beat id ${b.id}`);
    byId.set(b.id, { id: b.id, label: b.label, dur: b.dur, start: acc, end: acc + b.dur });
    acc += b.dur;
  }
  if (acc !== BEAT_END) throw new Error(`beat durations sum to ${acc}, not ${BEAT_END}`);

  const fade = { black: 0, begun: false };
  let t = 0;

  const beatAt = (time) => {
    if (!(time >= 0) || time >= BEAT_END) return null;   // null through the hold
    for (const b of byId.values()) if (time >= b.start && time < b.end) return b;
    return null;                                          // unreachable, but honest
  };

  const clock = {
    BEATS, order,
    len: BEAT_END, BEAT_END, HOLD, SHOW_LEN, FADE_LEN, FADE_START, dtClamp, wrapAt,
    HOLD_LABEL, fade,
    get t() { return t; },
    start: (id) => { const b = byId.get(id); if (!b) throw new Error(`unknown beat ${id}`); return b.start; },
    dur: (id) => { const b = byId.get(id); if (!b) throw new Error(`unknown beat ${id}`); return b.dur; },
    beatAt,
    seekTo(id) { t = clock.start(id); fade.black = 0; fade.begun = false; return t; },
    restart() { t = 0; fade.black = 0; fade.begun = false; },
    // The render loop calls this with its own dt; everything it needs for the frame
    // comes back in one object, so the loop never has to guess about state.
    tick(dt) {
      const step = Math.min(Math.max(Number(dt) || 0, 0), dtClamp);
      let wrapped = false;
      t += step;
      if (t > wrapAt) { t = 0; wrapped = true; }          // grace: one clamped frame, once
      fade.begun = t >= FADE_START;
      fade.black = Math.min(1, Math.max(0, (t - FADE_START + dtClamp) / FADE_LEN));
      return { t, beat: beatAt(t), black: fade.black, wrapped };
    },
  };

  return { clock };
})());

// Fragment 07: the lobby, the fountain and the Christmas tree.
//
// All three sit behind the curtain wall, in the podium's arcade band - the band
// the camera only ever sees through glass (R12/R13 keep the lens outside the
// envelope). So the shape of this batch is decided by two rules:
//
//   1. Nothing here may claim a cell the tower or the curtain wall already owns.
//      The podium's top row (y = P.y1) is a concrete deck slab, and the podium's
//      face rings (x = +-20, z = +-17) are mullions and bays, so everything below
//      stays in the interior rectangle and below the deck.
//   2. The fountain's water is the ground's water. The ground batch already
//      carved the reflecting pool (POOL, basin band + water band) and counts it
//      as waterVolume; this fragment reports that volume and puts the fountain's
//      rim, stem and spray above the water line instead, never re-claiming it.
//
// What the camera reads: warm glass at the arcade (Task 4's dusk rule), and
// behind it a lit interior - the lobby's own walls and downlights - so the glow
// has depth instead of being one bright sheet on the glass plane. The tree is
// dark green with one bright star on top, which is how a Christmas tree reads at
// dusk: silhouette first, then the star.
//
// The batch reports per-part counts, and its own occupancy map is what makes
// `countVox` the sum of the parts: a cell claimed by two materials throws.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const palette = NAKATOMIC.palette;
  const plan = NAKATOMIC._plan;
  const P = NAKATOMIC.tower.sections.podium;
  const POOL = plan.POOL;
  const STREET = plan.STREET;
  const idGlow = NAKATOMIC.glass.ids.lit;   // the lobby glows with the glass's own warm

  // --- materials, all auto-allocated from the scene range ---
  const ids = {
    floor: palette.id("#3a332c"),   // lobby floor, dark marble under the glow
    wall: palette.id("#6a5c4c"),    // lobby interior wall, warm stone
    bough: palette.id("#1c3a24"),   // the tree
    light: palette.id("#fff2c0"),   // downlights, and the star on the tree
    rim: palette.id("#8a8d94"),     // fountain coping and stem
    spray: palette.id("#7fb2d8"),   // the jet, above the water line
  };

  // --- where things stand, as one fact per feature ---
  const IL = { x0: P.x0 + 1, x1: P.x1 - 1, z0: P.z0 + 1, z1: P.z1 - 1 };  // interior, clear of the face rings
  const TC = { x: 8, z: 14 };          // the tree, in front of the lobby's front glass
  const TREE_FOOT = 2;                 // 5 x 5 at the base, 3 x 3 one band up
  const GLOW_BANDS = [STREET + 1, STREET + 2];   // the arcade is three bands tall: floor, wall, wall
  const LIGHT_ROW = [-15, -5, 5, 15];
  const LIGHT_COL = [-10, 0, 10];

  // --- the batch, with its own occupancy map: a cell may only have one material ---
  const insidePodium = (x, z) => x >= IL.x0 && x <= IL.x1 && z >= IL.z0 && z <= IL.z1;
  const cells = new Map();
  const runs = [];
  const parts = { floor: [], wall: [], bough: [], light: [], star: [], rim: [], spray: [] };
  const claim = (x, y, z, id, part) => {
    const key = `${x}|${y}|${z}`;
    const seen = cells.get(key);
    if (seen !== undefined) {
      if (seen !== id) throw new Error(`lobby cell ${key} claimed by two palette ids`);
      return;
    }
    if (insidePodium(x, z) && y >= P.y1) throw new Error(`lobby cell ${key} reaches the podium deck at y = ${P.y1}`);
    cells.set(key, id);
    parts[part].push({ x, y, z, id });
  };
  const put = (x, y, z, len, id, part) => {
    if (len <= 0) return;
    for (let i = 0; i < len; i++) claim(x + i, y, z, id, part);
    vox.addRun(x, y, z, len, id);
    runs.push({ x, y, z, len, id, part });
  };
  const one = (x, y, z, id, part) => put(x, y, z, 1, id, part);
  const rect = (x0, x1, y, z0, z1, id, part) => {
    for (let z = z0; z <= z1; z++) put(x0, y, z, x1 - x0 + 1, id, part);
  };
  // The edge of a rectangle, as one run per row. The lobby's lit wall sits on the
  // interior rectangle's edge - one cell behind the curtain wall - and the
  // fountain's coping sits on the pool's edge, above the water line.
  const ring = (r, y, id, part) => {
    put(r.x0, y, r.z0, r.x1 - r.x0 + 1, id, part);
    put(r.x0, y, r.z1, r.x1 - r.x0 + 1, id, part);
    for (let z = r.z0 + 1; z <= r.z1 - 1; z++) {
      put(r.x0, y, z, 1, id, part);
      put(r.x1, y, z, 1, id, part);
    }
  };

  const emit = () => {
    // ---- the lobby floor, cut around the tree's foot ----
    const hole = { x0: TC.x - TREE_FOOT, x1: TC.x + TREE_FOOT, z0: TC.z - TREE_FOOT, z1: TC.z + TREE_FOOT };
    for (let z = IL.z0; z <= IL.z1; z++) {
      let x = IL.x0;
      if (z >= hole.z0 && z <= hole.z1) {
        if (hole.x0 > x) put(x, STREET, z, hole.x0 - x, ids.floor, "floor");
        x = Math.max(x, hole.x1 + 1);
      }
      if (x <= IL.x1) put(x, STREET, z, IL.x1 - x + 1, ids.floor, "floor");
    }

    // ---- the tree: silhouette bands, then the star ----
    for (let y = STREET; y <= STREET + 1; y++) {
      const h = TREE_FOOT - (y - STREET);
      rect(TC.x - h, TC.x + h, y, TC.z - h, TC.z + h, ids.bough, "bough");
    }
    one(TC.x, STREET + 2, TC.z, ids.light, "star");

    // ---- the lobby's lit walls, one cell behind the glass line ----
    for (const y of GLOW_BANDS) ring(IL, y, idGlow, "wall");

    // ---- the lobby's downlights, at the ceiling band ----
    for (const lx of LIGHT_ROW)
      for (const lz of LIGHT_COL) one(lx, STREET + 2, lz, ids.light, "light");

    // ---- the fountain, above the water the ground already carved ----
    ring(POOL, STREET + 1, ids.rim, "rim");
    const cx = (POOL.x0 + POOL.x1) >> 1, cz = (POOL.z0 + POOL.z1) >> 1;
    one(cx, STREET + 1, cz, ids.rim, "rim");                                  // stem
    for (let x = cx - 1; x <= cx + 1; x++)
      for (let z = cz - 1; z <= cz + 1; z++)
        if (x !== cx || z !== cz) one(x, STREET + 2, z, ids.rim, "rim");       // upper basin
    for (let y = STREET + 2; y <= STREET + 3; y++) one(cx, y, cz, ids.spray, "spray");

    // ---- the numbers, and the cross-contract checks ------------------------
    // The curtain wall owns the facade ring; a lobby cell may never sit on it.
    const glassPlane = new Set(NAKATOMIC.glass.cells.map((c) => `${c.x}|${c.y}|${c.z}`));
    for (const key of cells.keys())
      if (glassPlane.has(key)) throw new Error(`lobby cell ${key} sits on the glass line`);

    const footprint = [];
    for (let x = POOL.x0; x <= POOL.x1; x++)
      for (let z = POOL.z0; z <= POOL.z1; z++) footprint.push(`${x},${z}`);

    return {
      voxels: runs.slice(),
      batchVox: runs.length,
      countVox: cells.size,
      ids,
      floorCount: parts.floor.length,
      glowCount: parts.wall.length,
      treeCount: parts.bough.length,
      lightsCount: parts.light.length,
      starCount: parts.star.length,
      fountainCount: parts.rim.length + parts.spray.length,
      treeCells: parts.bough.slice(),
      treeMinY: STREET,
      treeTopY: STREET + 1,
      starCell: parts.star[0],
      glowCells: parts.wall.slice(),
      fountainCells: parts.rim.concat(parts.spray),
      // the pool is the ground's, so its water is reported, not re-claimed
      waterCells: footprint.length,
      waterBand: STREET,
      waterFootprint: footprint,
    };
  };

  // One batch, once: like the ground, a rebuild would push the same cells through
  // addRun again while the coalesced buffer stayed put.
  let cached = null;
  const lobbyWorld = () => { if (cached === null) cached = emit(); return cached; };

  return {
    lobbyWorld,
    lobby: { interior: IL, tree: TC, pool: POOL, glowBands: [...GLOW_BANDS] },
  };
})());

// Fragment 08: the plaza dressings - the two taxis, the town car, the tree
// truck, and the marquee over the entrance drive.
//
// These are the mirror image of the lobby batch: the lobby lives inside the
// envelope and the camera reads it through glass, while everything here lives
// outside it, on the street, because these are objects the camera may sit next
// to. So the batch is built from the camera's own contract outward: every cell
// must satisfy envelope.isOutside, must stand on the block (isOnGround), and may
// never re-claim a cell the ground or the curtain wall already owns.
//
// The arrival court is the band in front of the podium's south face: z 20..24,
// clear of the 2 m envelope skirt (which maxes at z = 19), clear of the
// reflecting pool (z 25..27), clear of the boulevard kerbs (x -35/-34 and
// 34/35) and clear of the palm grove (x 24/30/36 at z +-25). That is why the
// lane sits there and not closer to the glass: a vehicle parked inside the
// skirt would be a cell the show's camera rules forbid the lens to reach.
//
// One band = one storey (~3.7 m), so a car body is one band and its cabin rides
// above it; the lamps sit on the free band above the body corners, and the
// marquee beam at band 3 clears the cabins and the truck's tree crate.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const palette = NAKATOMIC.palette;
  const plan = NAKATOMIC._plan;
  const STREET = plan.STREET;
  const idGlow = NAKATOMIC.glass.ids.lit;   // lamps and banner glow with the building's own warm

  // --- materials ---
  const ids = {
    car: palette.id("#2f333c"),    // the town car, black at dusk
    taxi: palette.id("#b38f2a"),   // cab yellow, muted by the dusk
    truck: palette.id("#5a5f6a"),  // the tree truck's cab
    crate: palette.id("#23402a"),  // the tree it still carries, on the flatbed
    steel: palette.id("#3a3e48"),  // marquee posts and beam
  };

  // --- where things stand, as one fact per feature ---
  const LANE = { x0: -20, x1: 20, z0: 20, z1: 24 };              // the arrival court
  const BODY = { z0: 21, z1: 22 };                               // vehicles park two cells deep
  const MARQUEE_Z = 24;                                          // posts on the pool-side kerb line
  const POSTS = [-12, 12];
  const BEAM_Y = 3, BANNER_Y = 2;

  // --- the batch, with its own occupancy map: a cell may only have one material ---
  const cells = new Map();
  const runs = [];
  const parts = { vehicle: [], light: [], marquee: [] };
  const claim = (x, y, z, id, part) => {
    const key = `${x}|${y}|${z}`;
    const seen = cells.get(key);
    if (seen !== undefined) {
      if (seen !== id) throw new Error(`dressing cell ${key} claimed by two palette ids`);
      return;
    }
    if (z < LANE.z0 || z > LANE.z1 || x < LANE.x0 || x > LANE.x1)
      throw new Error(`dressing cell ${key} is off the arrival court`);
    if (y < STREET) throw new Error(`dressing cell ${key} is below the street band`);
    cells.set(key, id);
    parts[part].push({ x, y, z, id });
  };
  const put = (x, y, z, len, id, part) => {
    if (len <= 0) return;
    for (let i = 0; i < len; i++) claim(x + i, y, z, id, part);
    vox.addRun(x, y, z, len, id);
    runs.push({ x, y, z, len, id, part });
  };
  const one = (x, y, z, id, part) => put(x, y, z, 1, id, part);
  const slab = (x0, x1, y, z0, z1, id, part) => {
    for (let z = z0; z <= z1; z++) put(x0, y, z, x1 - x0 + 1, id, part);
  };

  // a vehicle: body band, cabin on the free band above the middle, two lamps on
  // the band above the body's front corners
  const vehicle = (x0, x1, cabin0, cabin1, idBody, idCabin) => {
    slab(x0, x1, STREET, BODY.z0, BODY.z1, idBody, "vehicle");
    if (cabin1 >= cabin0) slab(cabin0, cabin1, STREET + 1, BODY.z0, BODY.z1, idCabin, "vehicle");
    one(x1, STREET + 1, BODY.z0, idGlow, "light");
    one(x1, STREET + 1, BODY.z1, idGlow, "light");
  };

  const emit = () => {
    // ---- the motorcade: two cabs, the town car, then the tree truck ----
    vehicle(-18, -15, -17, -16, ids.taxi, ids.taxi);
    vehicle(-10, -7, -9, -8, ids.taxi, ids.taxi);
    vehicle(0, 6, 2, 4, ids.car, ids.car);
    // the truck: flatbed, cab at its head, the crate it still carries two bands tall
    slab(11, 18, STREET, BODY.z0, BODY.z1, ids.truck, "vehicle");
    slab(11, 12, STREET + 1, BODY.z0, BODY.z1, ids.truck, "vehicle");
    slab(14, 17, STREET + 1, BODY.z0, BODY.z1, ids.crate, "vehicle");
    slab(14, 17, STREET + 2, BODY.z0, BODY.z1, ids.crate, "vehicle");
    one(18, STREET + 1, BODY.z0, idGlow, "light");
    one(18, STREET + 1, BODY.z1, idGlow, "light");

    // ---- the marquee: posts on the ground, banner between them, beam above ----
    for (const px of POSTS)
      for (let y = STREET; y < BANNER_Y + 1; y++) one(px, y, MARQUEE_Z, ids.steel, "marquee");
    for (let x = POSTS[0] + 3; x <= POSTS[1] - 3; x++) one(x, BANNER_Y, MARQUEE_Z, idGlow, "light");
    for (let x = POSTS[0]; x <= POSTS[1]; x++) one(x, BEAM_Y, MARQUEE_Z, ids.steel, "marquee");

    // ---- the numbers ---
    let vehicleMinY = Infinity;
    for (const c of parts.vehicle) vehicleMinY = Math.min(vehicleMinY, c.y);

    return {
      voxels: runs.slice(),
      batchVox: runs.length,
      countVox: cells.size,
      ids,
      lane: { ...LANE },
      vehicleCells: parts.vehicle.slice(),
      marqueeCells: parts.marquee.slice(),
      lightCells: parts.light.slice(),
      vehicleCount: parts.vehicle.length,
      marqueeCount: parts.marquee.length,
      lightCount: parts.light.length,
      vehicleMinY,
      marqueeZ: MARQUEE_Z,
      beamY: BEAM_Y,
    };
  };

  // One batch, once: like the ground and the lobby, a rebuild would push the
  // same cells through addRun again while the coalesced buffer stayed put.
  let cached = null;
  const plazaDressing = () => { if (cached === null) cached = emit(); return cached; };

  return {
    plazaDressing,
    dressing: { lane: { ...LANE }, bodyDepth: BODY, marqueeZ: MARQUEE_Z, posts: [...POSTS] },
  };
})());

// Fragment 09: the roof - the gun run, the pulled-glass stacks, and the tile
// helicopter that pulled them.
//
// Above the roof deck is the one region the camera rules always allow: R12/13
// call anything over the deck outside by definition, so this batch builds with
// the envelope as its floor, not its wall. Every cell here lives at band
// roofDeck + 1 or higher; the claim guard rejects anything lower, which makes
// collisions with the tower, the glass line and the penthouse physically
// impossible rather than something a test has to remember.
//
// The stacks ARE the glass the helo pulled from the facade - the tile-helo of
// the film hoisting panels off the curtain wall - so they wear the shatter id
// Appendix A pins (0xd003), the same id Task 10's blast burst uses. The gun run
// is the brass the roof fight left behind, stacked along the penthouse edge.
//
// The helo hovers on the courtyard side (z 20..21) with its winch line down to
// a panel at deck height: that is the beat where the roof gets stripped, read
// as one object - body, rotor disc, tail, line, cargo - not as a screenshot.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const palette = NAKATOMIC.palette;
  const tower = NAKATOMIC.tower;
  const U = tower.sections.upper;
  const PH = tower.sections.penthouse;
  const DECK = tower.roofDeck;                  // 46: the envelope's top
  const GLASS = NAKATOMIC.glass.ids;
  const idGlow = GLASS.lit;

  // --- materials ---
  const ids = {
    brass: palette.id("#6e5c2e"),   // the gun run
    hull: palette.id("#46503e"),    // the helo, muted green
    metal: palette.id("#59606a"),   // rotor disc, winch line
  };
  const shatter = GLASS.shatter;    // pinned, not allocated - it is Appendix A's shard id

  // --- where things stand ---
  const STACKS = [[-11, -11], [-11, 10], [10, -11], [10, 10]];   // 2 x 2 corners of the deck, clear of the penthouse
  const RUN_Y = DECK + 1;
  const HELO = { x0: -4, x1: 3, z0: 20, z1: 21, y0: DECK + 4, y1: DECK + 5 };
  const DISC = { y: DECK + 6, x0: -10, x1: 7 };
  const WINCH = { x: 2, z: 20 };

  // --- the batch, one material per cell, and nothing below the roof line ---
  const cells = new Map();
  const runs = [];
  const parts = { stack: [], run: [], helo: [], light: [] };
  const inPH = (x, z, y) => x >= PH.x0 && x <= PH.x1 && z >= PH.z0 && z <= PH.z1 && y >= PH.y0 && y <= PH.y1;
  const claim = (x, y, z, id, part) => {
    const key = `${x}|${y}|${z}`;
    if (y <= DECK) throw new Error(`roof cell ${key} is at or below the deck band`);
    if (inPH(x, z, y)) throw new Error(`roof cell ${key} is inside the penthouse`);
    const seen = cells.get(key);
    if (seen !== undefined) {
      if (seen !== id) throw new Error(`roof cell ${key} claimed by two palette ids`);
      return;
    }
    cells.set(key, id);
    parts[part].push({ x, y, z, id });
  };
  const put = (x, y, z, len, id, part) => {
    if (len <= 0) return;
    for (let i = 0; i < len; i++) claim(x + i, y, z, id, part);
    vox.addRun(x, y, z, len, id);
    runs.push({ x, y, z, len, id, part });
  };
  const one = (x, y, z, id, part) => put(x, y, z, 1, id, part);

  const emit = () => {
    // ---- the pulled-glass stacks: two tiers each, at the deck's four corners ----
    for (const [sx, sz] of STACKS) {
      for (const dx of [0, 1]) for (const dz of [0, 1]) one(sx + dx, RUN_Y, sz + dz, shatter, "stack");
      for (const dx of [0, 1]) one(sx + dx, RUN_Y + 1, sz, shatter, "stack");
    }

    // ---- the gun run: brass stacked along both penthouse edges, on the deck band ----
    put(-8, RUN_Y, PH.z0 - 1, 17, ids.brass, "run");
    put(-8, RUN_Y, PH.z1 + 1, 17, ids.brass, "run");

    // ---- the tile helo, hovering over the courtyard it worked from ----
    for (let y = HELO.y0; y <= HELO.y1; y++)
      for (let z = HELO.z0; z <= HELO.z1; z++)
        put(HELO.x0, y, z, HELO.x1 - HELO.x0 + 1, ids.hull, "helo");
    for (let z = HELO.z0; z <= HELO.z1; z++)                           // tail boom
      put(-8, HELO.y0, z, 4, ids.hull, "helo");
    for (let z = HELO.z0; z <= HELO.z1; z++)                           // rotor disc, one flat run each
      put(DISC.x0, DISC.y, z, DISC.x1 - DISC.x0 + 1, ids.metal, "helo");
    for (let y = RUN_Y + 1; y <= HELO.y0 - 1; y++)                     // winch line to the panel
      one(WINCH.x, y, WINCH.z, ids.metal, "helo");
    one(WINCH.x, RUN_Y, WINCH.z, shatter, "helo");                     // the panel it is hauling
    one(HELO.x0 + 3, HELO.y0 - 1, HELO.z0, idGlow, "light");           // lights under the hull
    one(HELO.x0 + 4, HELO.y0 - 1, HELO.z1, idGlow, "light");

    // ---- the numbers ---
    let stackMinY = Infinity, heloMinY = Infinity, heloTopY = -Infinity;
    for (const c of parts.stack) stackMinY = Math.min(stackMinY, c.y);
    for (const c of parts.helo) { heloMinY = Math.min(heloMinY, c.y); heloTopY = Math.max(heloTopY, c.y); }

    return {
      voxels: runs.slice(),
      batchVox: runs.length,
      countVox: cells.size,
      ids,
      stackCells: parts.stack.slice(),
      runCells: parts.run.slice(),
      heloCells: parts.helo.slice(),
      lightCells: parts.light.slice(),
      stackCount: parts.stack.length,
      runCount: parts.run.length,
      heloCount: parts.helo.length,
      lightCount: parts.light.length,
      stackMinY,
      heloMinY,
      heloTopY,
      hover: { ...HELO },
    };
  };

  // One batch, once: like the ground and the other scene batches, a rebuild
  // would push the same cells through addRun again while the buffer stayed put.
  let cached = null;
  const roofWorld = () => { if (cached === null) cached = emit(); return cached; };

  return {
    roofWorld,
    roofline: { stacks: STACKS.map((s) => [...s]), helo: { ...HELO }, disc: { ...DISC }, winch: { ...WINCH } },
  };
})());

// Fragment 99: the render rig - world to screen. First pixels.
//
// R18 said the wiring belonged in Task 13; Jon pulled it forward as Task 7.5 on
// 2026-11-25 so Tasks 7-12 land visibly instead of blind. The `99-` prefix is not
// cosmetics: fragments 01..98 must have published their APIs before this one reads
// the shared buffer, because the world is assembled here, once.
//
// Nothing at eval time touches the DOM, GL or the ground batch: the boot gate in
// verify/unit.mjs runs the page with no browser, and it stays green only because
// the renderer, the camera and the event bindings appear inside start(). The one
// exception is the scene object itself, whose shape is pinned by that gate.
//
// The show's own camera: Task 12 publishes NAKATOMIC.rig = { keys, sample }, and
// the loop below consumes it when it is there (scene.follow). Until then the loop
// drives the hand-rolled orbit rig - no addons, per the plan's one-rule imports.

Object.assign(NAKATOMIC, (() => {
  const vox = NAKATOMIC.vox;
  const clock = NAKATOMIC.clock;
  const envelope = NAKATOMIC.envelope;

  // --- the buffer view, in point form. Page-side twin of tools/jsp.mjs, kept
  // THREE-free so the gate can run it with no GL and compare both sides. --------
  const splats = (buffer) => {
    if (!buffer || !Array.isArray(buffer.runs))
      throw new Error("splats wants the buffer view: { runs: [...], hexOf(id) }");
    const points = [];
    const colors = [];
    for (const r of buffer.runs) {
      const hex = buffer.hexOf(r.id);
      if (!hex) throw new Error(`no palette colour for id 0x${Number(r.id).toString(16)}`);
      for (let i = 0; i < r.len; i++) {
        points.push([r.x + i, r.y, r.z]);
        colors.push(hex);
      }
    }
    return { points, colors };
  };

  // --- one world, built once. Fragments 03/04 emitted at boot; the ground,
  // lobby and dressing batches are on demand, so this is the place that pulls
  // them in. A second call returns the cached world: the render loop must never
  // rebuild the plaza per frame. --------------------------------------------
  let world = null;
  const ensureWorld = () => {
    if (world === null) {
      const ground = NAKATOMIC.ground();
      const lobby = NAKATOMIC.lobbyWorld();
      const dressing = NAKATOMIC.plazaDressing();
      const roof = NAKATOMIC.roofWorld();
      world = {
        ground,
        lobby,
        dressing,
        roof,
        bounds: vox.bounds(),
        voxels: vox.count,
        buffer: vox.buffer(),
      };
    }
    return world;
  };

  // --- framing 1..4: the four camera setups the show reads as its own wide shots.
  // yaw is the orbit angle in degrees (0 = the +z side of the block, so ~180 faces
  // the plaza front, where the glass atrium and the lobby arcade are), pitch is the
  // elevation, and `dist` is a multiple of the envelope radius - every setup here
  // starts further out than the tower's own corner, before the clamp ever runs.
  const FRAMINGS = [
    // Framing 1 is the wide establishing shot: the whole massing (roofline to lot
    // edge) has to sit in frame with sky above it, so the target sits mid-tower and
    // the lens stays well out. Framing 2 is the tower close, 3 the lobby-level pass,
    // 4 looks back over the deck.
    { name: "boulevard wide", yaw: 208, pitch: 10, dist: 2.4, fov: 46, target: [0, 18, -6] },
    { name: "tower close", yaw: 168, pitch: 12, dist: 1.15, fov: 42, target: [0, 24, 0] },
    { name: "lobby level", yaw: 186, pitch: 4, dist: 2.25, fov: 50, target: [0, 4, -8] },
    { name: "over the deck", yaw: 196, pitch: 48, dist: 2.3, fov: 44, target: [0, 16, 10] },
  ];

  // sRGB hex -> the linear values the renderer's working space wants, so the
  // palette hexes the gates assert on are the hexes the eye sees. Inline because
  // THREE.Color is not available to the gate stub, and math is cheaper anyway.
  // The /255 is the whole business: srgbToLinear wants a 0..1 channel, and handing
  // it the raw byte makes pow((107 + 0.055) / 1.055, 2.4) = 65,350, which clamps to
  // white in the shader and washes the whole plaza out. Exposed as NAKATOMIC.colorLinear
  // so the gate can pin the range for every palette entry, and so the fx tasks read
  // colours through the same one function.
  const srgbToLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const colorLinear = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    return [
      srgbToLinear(((n >> 16) & 0xff) / 255),
      srgbToLinear(((n >> 8) & 0xff) / 255),
      srgbToLinear((n & 0xff) / 255),
    ];
  };

  // R12/R13: the lens stays outside the tower envelope, always. The orbit target
  // can sit inside the building, so a distance clamp alone does not guarantee it -
  // this walks the point out along its own ray from the target until the envelope
  // agrees. That makes `envelope.isOutside(camera.position)` an invariant, not a
  // configuration, and Task 14 asserts it as one.
  const clearOfEnvelope = (target, p) => {
    let pos = { x: p.x, y: p.y, z: p.z };
    if (envelope.isOutside(pos)) return pos;
    let dx = pos.x - target.x, dy = pos.y - target.y, dz = pos.z - target.z;
    let len = Math.hypot(dx, dy, dz);
    if (len < 1e-6) { dy = 1; len = 1; }               // a lens on its own target: lift it up
    const ux = dx / len, uy = dy / len, uz = dz / len;
    let d = Math.max(len, 1);
    for (let i = 0; i < 240 && !envelope.isOutside(pos); i++) {
      d *= 1.08;
      pos = { x: target.x + ux * d, y: target.y + uy * d, z: target.z + uz * d };
    }
    return pos;
  };

  // rig state: spherical orbit around a target. `pose` is the show's own camera
  // (Task 12's rig feeds it through setPose); while it is set, orbit state idles.
  const rig = {
    yaw: 0, pitch: 0, dist: 0, target: { x: 0, y: 0, z: 0 },
  };
  let pose = null;
  let rigReady = false;

  const applyPose = (camera, pos, target, fov) => {
    camera.position.set(pos.x, pos.y, pos.z);
    if (fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
    camera.lookAt(target.x, target.y, target.z);
  };

  const orbitPos = () => {
    const cp = Math.cos(rig.pitch * Math.PI / 180);
    const cy = Math.cos(rig.yaw * Math.PI / 180);
    const sz = Math.sin(rig.yaw * Math.PI / 180);
    const pos = {
      x: rig.target.x + rig.dist * cp * sz,
      y: rig.target.y + rig.dist * Math.sin(rig.pitch * Math.PI / 180),
      z: rig.target.z + rig.dist * cp * cy,
    };
    return clearOfEnvelope(rig.target, pos);
  };

  // The scene's public object is assembled before start(): the gate asserts its
  // shape with no GL in the room, so every key exists at eval time.
  const scene = {
    running: false,
    paused: false,
    follow: true,
    gl: null,
    camera: null,
    domElement: null,
    fov: FRAMINGS[0].fov,
    framing: 1,
    stats: { points: 0, voxels: 0, fps: 0 },

    // The HUD's label rule, as a pure function: beatAt is null through the hold,
    // so a null beat is not a missing label - it is the hold, and it needs a label.
    label(f) {
      if (f && f.beat) return f.beat.label;
      if (f && f.t >= clock.BEAT_END) return clock.HOLD_LABEL;
      return "";
    },

    setFraming(n) {
      const i = Math.min(Math.max(Number(n) || 1, 1), FRAMINGS.length);
      const f = FRAMINGS[i - 1];
      scene.framing = i;
      rig.yaw = f.yaw;
      rig.pitch = f.pitch;
      rig.dist = envelope.radius * f.dist;
      rig.target = { x: f.target[0], y: f.target[1], z: f.target[2] };
      scene.fov = f.fov;
      pose = null;
      if (rigReady) applyPose(scene.camera, orbitPos(), rig.target, scene.fov);
      return i;
    },

    // The show's own camera pose: { pos, target, fov } in buffer units. Task 12's
    // per-beat keys land here; the envelope clamp still runs, so a key that tries
    // to put the lens inside the tower ends up outside it anyway.
    setPose(p) {
      if (!p || !p.pos) return null;
      const target = p.target || { x: 0, y: 0, z: 0 };
      const pos = clearOfEnvelope(target, { x: p.pos.x, y: p.pos.y, z: p.pos.z });
      pose = { pos, target, fov: p.fov };
      if (pose.fov) scene.fov = pose.fov;
      if (rigReady) applyPose(scene.camera, pose.pos, pose.target, pose.fov);
      return pose;
    },

    togglePause() { scene.paused = !scene.paused; return scene.paused; },
    restart() { clock.restart(); pose = null; return clock.t; },

    // Rebuilds the splat cloud from the current buffer: the content tasks (7..12)
    // add geometry and the shatter fx change ids, so the cloud has to be re-read.
    rebuild() {
      if (!rigReady) return scene.stats;
      world = null;
      const w = ensureWorld();
      const s = splats(w.buffer);
      const n = s.points.length;
      const positions = new Float32Array(n * 3);
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const p = s.points[i];
        positions[i * 3] = p[0]; positions[i * 3 + 1] = p[1]; positions[i * 3 + 2] = p[2];
        const c = colorLinear(s.colors[i]);
        colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2];
      }
      if (cloud) {
        sceneObj.remove(cloud);
        cloud.geometry.dispose();
        cloud.material.dispose();
      }
      cloud = null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.95, sizeAttenuation: true, vertexColors: true, fog: true,
      });
      cloud = new THREE.Points(geo, mat);
      sceneObj.add(cloud);
      scene.stats.points = n;
      scene.stats.voxels = w.voxels;
      return scene.stats;
    },

    // One frame of the show. The rAF wrapper calls it, and the pixel gates drive it
    // by hand, so both paths exercise the same code: one clock tick, one pose, one
    // render, one HUD update, one fade value.
    step(dt) {
      // While paused the tool owns the clock (it seeks, then paints), so the frame
      // comes from the clock's current state instead of a stale tick.
      frame = scene.paused ? frameFromClock() : clock.tick(dt);
      const w = ensureWorld();
      if (!scene.paused && scene.follow && NAKATOMIC.rig && frame.beat) {
        const key = NAKATOMIC.rig.sample(frame.beat.id, frame.t);
        if (key) scene.setPose(key);
      }
      if (rigReady) {
        if (pose) applyPose(scene.camera, pose.pos, pose.target, pose.fov);
        else applyPose(scene.camera, orbitPos(), rig.target, scene.fov);
        if (hud) paintHud(frame);
        gl.render(sceneObj, scene.camera);
      }
      return frame;
    },

    start() {
      if (scene.running) return scene;
      const stage = document.getElementById("stage");
      gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      gl.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      gl.setSize(window.innerWidth, window.innerHeight);
      gl.outputColorSpace = THREE.SRGBColorSpace;
      const dusk = new THREE.Color(0x0a0c12);
      gl.setClearColor(dusk, 1);
      stage.appendChild(gl.domElement);
      scene.gl = gl;
      scene.domElement = gl.domElement;

      sceneObj = new THREE.Scene();
      sceneObj.background = dusk;
      sceneObj.fog = new THREE.FogExp2(0x0a0c12, 0.0022);

      const w = ensureWorld();
      scene.camera = new THREE.PerspectiveCamera(
        FRAMINGS[0].fov, window.innerWidth / window.innerHeight, 0.5,
        // far reaches past the skyline walls at z = 70 from any orbit the rig allows
        Math.max(600, envelope.radius * 8),
      );
      scene.setFraming(1);
      rigReady = true;
      scene.rebuild();
      hud = {
        beat: document.getElementById("beat"),
        meta: document.getElementById("meta"),
        stat: document.getElementById("stat"),
        fade: document.getElementById("fade"),
      };
      bindInput(gl.domElement);
      rigReady = true;
      scene.running = true;
      loop = (now) => {
        rafId = requestAnimationFrame(loop);
        const dt = lastNow === null ? clock.dtClamp : (now - lastNow) / 1000;
        lastNow = now;
        scene.step(dt);
        // A plain EMA of the frame rate: the HUD reads it, nothing in the show does.
        const rate = 1 / Math.max(dt, 1e-4);
        scene.stats.fps = scene.stats.fps ? scene.stats.fps * 0.9 + rate * 0.1 : rate;
      };
      rafId = requestAnimationFrame(loop);
      return scene;
    },
  };

  // --- internals the closure owns; the public object above is the only handle ----
  let gl = null;
  let sceneObj = null;
  let cloud = null;
  let hud = null;
  // A frame from the clock without advancing it: what `step` reads while paused.
  const frameFromClock = () => ({
    t: clock.t, beat: clock.beatAt(clock.t), black: clock.fade.black, wrapped: false,
  });
  let frame = frameFromClock();
  let rafId = 0;
  let lastNow = null;
  let loop = null;

  const paintHud = (f) => {
    hud.beat.textContent = scene.label(f);
    hud.meta.textContent = `${f.t.toFixed(2)} s of ${clock.SHOW_LEN}`
      + `  ${(f.beat && f.beat.id) || "hold"}`
      + `  framing ${scene.framing}/${FRAMINGS.length}`
      + (scene.paused ? "  paused" : "");
    hud.stat.textContent = `${scene.stats.points} splats  ${scene.stats.voxels} vox  `
      + `fps ${scene.stats.fps.toFixed(0)}`;
    hud.fade.style.opacity = String(f.black);
  };

  const bindInput = (canvas) => {
    let drag = null;
    canvas.addEventListener("pointerdown", (e) => {
      drag = { x: e.clientX, y: e.clientY, yaw: rig.yaw, pitch: rig.pitch };
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag) return;
      rig.yaw = drag.yaw + (e.clientX - drag.x) * 0.28;
      rig.pitch = Math.min(88, Math.max(-20, drag.pitch - (e.clientY - drag.y) * 0.22));
      pose = null;
    });
    const up = () => { drag = null; };
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointerleave", up);
    canvas.addEventListener("wheel", (e) => {
      const min = envelope.radius * 1.05;      // the lens never gets inside the tower
      rig.dist = Math.min(envelope.radius * 6, Math.max(min, rig.dist * (1 + e.deltaY * 0.0012)));
      pose = null;
    }, { passive: true });
    window.addEventListener("keydown", (e) => {
      const k = e.key;
      if (k >= "1" && k <= String(FRAMINGS.length)) scene.setFraming(Number(k));
      else if (k === " ") { scene.togglePause(); e.preventDefault(); }
      else if (k === "r" || k === "R") scene.restart();
    });
    window.addEventListener("resize", () => {
      if (!gl) return;
      gl.setSize(window.innerWidth, window.innerHeight);
      scene.camera.aspect = window.innerWidth / window.innerHeight;
      scene.camera.updateProjectionMatrix();
    });
  };

  return { splats, ensureWorld, colorLinear, scene };
})());

</script>
